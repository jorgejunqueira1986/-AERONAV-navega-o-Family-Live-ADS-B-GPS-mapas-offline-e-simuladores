name: AERONAV RC12.37.6 Automatic Flight Cameras

'on':
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install_auto_cameras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply RC12.37.6
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f sw.js
          test -f flight-camera-director.js
          test -f flight-ops-fragment.js

          python3 - <<'PY'
          from pathlib import Path
          import base64

          h = Path("index.html").read_text(encoding="utf-8")
          old_title = "<title>AERONAV — RC12.37.5</title>"
          old_app = "const APP_VERSION = 'RC12.37.5 · Manual Flight Camera Director';"

          if old_title not in h:
              raise SystemExit("Expected RC12.37.5 title not found")
          if old_app not in h:
              raise SystemExit("Expected RC12.37.5 APP_VERSION not found")

          h = h.replace(old_title, "<title>AERONAV — RC12.37.6</title>", 1)
          h = h.replace(
              old_app,
              "const APP_VERSION = 'RC12.37.6 · Automatic Flight Camera Director';",
              1
          )

          old_camera_tag = '<script src="./flight-camera-director.js?v=RC12.37.5"></script>'
          new_camera_tag = '<script src="./flight-camera-director.js?v=RC12.37.6"></script>'
          if old_camera_tag not in h:
              raise SystemExit("RC12.37.5 camera script tag not found")
          h = h.replace(old_camera_tag, new_camera_tag, 1)

          Path("index.html").write_text(h, encoding="utf-8")

          camera_js = base64.b64decode("").decode("utf-8")
          Path("flight-camera-director.js").write_text(camera_js, encoding="utf-8")

          s = Path("sw.js").read_text(encoding="utf-8")
          old_header = "/* AERONAV RC12.37.5 — Manual Flight Camera Director + versioned offline shell */"
          old_cache = "const CACHE='aeronav-jorge-RC12_37_5-flight-cameras-20261008';"
          old_release = "release:'RC12.37.5'"

          if old_header not in s:
              raise SystemExit("Expected RC12.37.5 SW header not found")
          if old_cache not in s:
              raise SystemExit("Expected RC12.37.5 cache not found")
          if old_release not in s:
              raise SystemExit("Expected RC12.37.5 SW release not found")

          s = s.replace(
              old_header,
              "/* AERONAV RC12.37.6 — Automatic Flight Camera Director + versioned offline shell */",
              1
          )
          s = s.replace(
              old_cache,
              "const CACHE='aeronav-jorge-RC12_37_6-auto-flight-cameras-20261008';",
              1
          )
          s = s.replace(old_release, "release:'RC12.37.6'", 1)

          Path("sw.js").write_text(s, encoding="utf-8")
          PY

      - name: Validate RC12.37.6
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check flight-camera-director.js

          grep -q "<title>AERONAV — RC12.37.6</title>" index.html
          grep -q "const APP_VERSION = 'RC12.37.6 · Automatic Flight Camera Director';" index.html
          grep -q 'flight-camera-director.js?v=RC12.37.6' index.html

          grep -q "AUTO ON" flight-camera-director.js
          grep -q "AUTO OFF" flight-camera-director.js
          grep -q "automatic:setAutomatic" flight-camera-director.js
          grep -q "ground:'behind'" flight-camera-director.js
          grep -q "taxi:'behind'" flight-camera-director.js
          grep -q "takeoff:'behind'" flight-camera-director.js
          grep -q "climb:'right'" flight-camera-director.js
          grep -q "cruise:'behind'" flight-camera-director.js
          grep -q "descent:'left'" flight-camera-director.js
          grep -q "approach:'inclined'" flight-camera-director.js
          grep -q "landing:'behind'" flight-camera-director.js
          grep -q "aeronav.flightops.phase.v1" flight-camera-director.js

          grep -q "aeronav-jorge-RC12_37_6-auto-flight-cameras-20261008" sw.js
          grep -q "release:'RC12.37.6'" sw.js

      - name: Commit RC12.37.6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AERONAV Update"
          git config user.email "actions@users.noreply.github.com"

          git add index.html sw.js flight-camera-director.js

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "RC12.37.6 add automatic flight cameras with off switch"
          git push origin HEAD:main
