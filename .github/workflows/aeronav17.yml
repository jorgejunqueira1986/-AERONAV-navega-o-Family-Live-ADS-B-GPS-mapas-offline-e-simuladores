name: AERONAV RC12.37.17 iPad Safe Update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aeronav-ipad-update
  cancel-in-progress: false
jobs:
  safe_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Corrigir cache sem apagar PMTiles
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          
          sw_path=Path('sw.js')
          idx_path=Path('index.html')
          sw=sw_path.read_text(encoding='utf-8')
          idx=idx_path.read_text(encoding='utf-8')
          
          # Refuse to modify an unknown generation, rather than risking maps or offline data.
          assert "const CACHE='aeronav-jorge-RC12_37_16-rear-and-live-cockpit-20261008'" in sw, 'sw.js RC12.37.16 baseline nao encontrada'
          assert "const APP_VERSION = 'RC12.37.16" in idx, 'index.html RC12.37.16 baseline nao encontrada'
          assert "./flight-angle-photo-renderer.js?v=RC12.37.16" in idx, 'Renderizador TAAG RC12.37.16 nao encontrado'
          
          sw=sw.replace("const CACHE='aeronav-jorge-RC12_37_16-rear-and-live-cockpit-20261008'", "const CACHE='aeronav-jorge-RC12_37_17-ipad-safe-update-20261008'", 1)
          assert 'const CRITICAL=' not in sw
          critical="""const CRITICAL=['./index.html','./sw.js','./flight-angle-photo-renderer.js','./assets/flight-angle-renders/b777300/behind_rc123716.webp','./assets/flight-angle-renders/b777300/cockpit_rc123716.webp'];
          """
          sw=sw.replace('const REMOTE=[',critical+'const REMOTE=[',1)
          
          begin=sw.index("self.addEventListener('install',event=>{")
          end=sw.index('async function injectAngolaMapsIntoMainNavigation(',begin)
          old=sw[begin:end]
          assert 'warm().then(result=>' in old and 'caches.delete' in old
          replacement="""/* RC12.37.17: install the next release after five critical files are ready.
             Optional offline fonts, GLB, maps and libraries are warmed after activation.
             Never clear IndexedDB, localStorage or saved PMTiles. */
          self.addEventListener('install',event=>{
            event.waitUntil((async()=>{
              const c=await caches.open(CACHE);
              const ok=await Promise.all(CRITICAL.map(async u=>{
                try{
                  const r=await fetchTimed(u,{cache:'reload'},15000);
                  if(!r.ok)return false;
                  await c.put(u,r.clone());return true;
                }catch(_){return false;}
              }));
              if(ok.some(x=>!x))throw new Error('Ficheiros essenciais incompletos; cache antigo preservado.');
              await self.skipWaiting();
            })());
          });
          
          self.addEventListener('activate',event=>{
            event.waitUntil((async()=>{
              await self.clients.claim();
              const result=await warm().catch(()=>({localReady:false}));
              // Delete ONLY outdated AERONAV Jorge app-shell caches after a full warmup.
              // Other cache stores (including map packs) and all IndexedDB data are untouched.
              if(result.localReady){
                const keys=await caches.keys();
                await Promise.all(keys.filter(k=>k!==CACHE&&k.startsWith('aeronav-jorge-RC12_'))
                  .map(k=>caches.delete(k)));
              }
            })());
          });
          
          """
          sw=sw[:begin]+replacement+sw[end:]
          needle="event.respondWith((async()=>injectAngolaMapsIntoMainNavigation(await shellFirst(req),req))());"
          assert sw.count(needle)==1,'Navegacao SW inesperada'
          sw=sw.replace(needle,"event.respondWith((async()=>injectAngolaMapsIntoMainNavigation(await networkFirst(req),req))());",1)
          sw=sw.replace("release:'RC12.37.16'", "release:'RC12.37.17'",1)
          sw=sw.replace('/* AERONAV RC12.37.14 — plane-only perspectives; offline GLB cache */','/* AERONAV RC12.37.17 — iPad PWA safe refresh / network-first navigation */',1)
          
          idx=idx.replace('<title>AERONAV — RC12.37.16</title>','<title>AERONAV — RC12.37.17</title>',1)
          idx=idx.replace("const APP_VERSION = 'RC12.37.16 · Vista traseira e cockpit dinamico';","const APP_VERSION = 'RC12.37.17 · Atualização segura iPad';",1)
          assert idx.count('</body>')==1
          repair_script="""<script id="aeronav-ipad-safe-update-3717">
          (()=>{
            'use strict';
            let busy=false,swReloaded=false;
            if('serviceWorker' in navigator){
              navigator.serviceWorker.addEventListener('controllerchange',()=>{
                if(swReloaded)return;
                swReloaded=true;
                const key='aeronav.ipad.sw-reloaded.RC12.37.17';
                try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1');}catch(_){ }
                location.reload();
              });
            }
            function setup(){
              const menu=document.getElementById('mobileMapMenu');
              if(!menu||document.getElementById('aeronavIpadSafeUpdateBtn3717'))return;
              const button=document.createElement('button');
              button.type='button';button.id='aeronavIpadSafeUpdateBtn3717';
              button.textContent='♻ Atualizar aplicação (sem apagar mapas)';
              button.addEventListener('click',async()=>{
                if(busy)return;busy=true;button.disabled=true;button.textContent='♻ A verificar atualização…';
                try{
                  if('serviceWorker' in navigator){
                    const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
                    await reg.update();
                  }
                  const url=new URL('./index.html',location.href);
                  url.searchParams.set('aeronav-refresh',String(Date.now()));
                  location.replace(url.href);
                }catch(e){
                  busy=false;button.disabled=false;button.textContent='♻ Tentar atualização novamente';
                  const toast=document.getElementById('toast');
                  if(toast){toast.textContent='Atualização: '+String(e?.message||e);toast.classList.add('show');}
                }
              });
              menu.appendChild(button);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup,{once:true});
            else setup();
          })();
          </script>
          """
          idx=idx.replace('</body>',repair_script+'</body>',1)
          
          sw_path.write_text(sw,encoding='utf-8')
          idx_path.write_text(idx,encoding='utf-8')
          
          # Non-destructive standalone repair page; NOT in the SW's LOCAL list.
          # Existing older service workers pass unmatched paths straight through to the network.
          Path('actualizar-ipad.html').write_text("""<!doctype html>
          <html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>AERONAV | Atualizar iPad</title><style>
          body{background:#071725;color:#ecf9ff;font-family:system-ui,-apple-system,sans-serif;margin:0;padding:30px 22px;line-height:1.5}
          main{max-width:580px;margin:10vh auto}h1{font-size:26px}button{background:#087edb;border:1px solid #6ecaff;color:white;padding:16px;border-radius:13px;font-weight:800;font-size:17px;width:100%;margin:12px 0}p{color:#b6d9eb}.status{padding:14px;background:#10283b;border-radius:12px}
          </style></head><body><main><h1>✈ AERONAV — atualizar no iPad</h1><p>Atualize os ficheiros da aplicação sem apagar mapas PMTiles, rotas ou dados do dispositivo.</p><button id="go" type="button">Verificar e atualizar</button><p class="status" id="status">Aguardando confirmação.</p><p>Não escolha «Limpar dados de websites» nem elimine o ícone da aplicação.</p></main>
          <script>
          const go=document.getElementById('go'),status=document.getElementById('status');
          go.onclick=async()=>{
           go.disabled=true;status.textContent='A verificar a atualização…';
           try{
            if('serviceWorker'in navigator){
             const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
             await reg.update();
             if(reg.installing){
              status.textContent='A preparar a nova versão. Aguarde…';
              await Promise.race([new Promise(resolve=>{let w=reg.installing;if(!w)return resolve();w.addEventListener('statechange',()=>{if(w.state==='activated'||w.state==='redundant')resolve();});}),new Promise(resolve=>setTimeout(resolve,20000))]);
             }
            }
            status.textContent='A abrir o AERONAV atualizado…';
            const url=new URL('./index.html',location.href);url.searchParams.set('atualizar',String(Date.now()));
            location.replace(url.href);
           }catch(e){status.textContent='Não foi possível atualizar: '+String(e?.message||e);go.disabled=false;}
          };
          </script></body></html>""",encoding='utf-8')
          
          assert "networkFirst(req),req" in sw
          assert "CRITICAL.map" in sw
          assert 'aeronavIpadSafeUpdateBtn3717' in idx
          assert "const APP_VERSION = 'RC12.37.17" in idx
          assert 'indexedDB.deleteDatabase' not in repair_script
          print('SW, index, actualizar-ipad.html: patched; PMTiles storage unchanged')
          PY
      - name: Validar sintaxe e ficheiros
        shell: bash
        run: |
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          sw=Path('sw.js').read_text()
          html=Path('index.html').read_text()
          assert "networkFirst(req),req" in sw
          assert "const CRITICAL=" in sw
          assert "aeronav-ipad-safe-update-3717" in html
          assert Path('actualizar-ipad.html').is_file()
          assert Path('assets/flight-angle-renders/b777300/behind_rc123716.webp').is_file()
          assert Path('assets/flight-angle-renders/b777300/cockpit_rc123716.webp').is_file()
          assert "RC12.37.17" in sw and "RC12.37.17" in html
          print('PASS: SW, PWA, imagens e reparacao iPad')
          PY
      - name: Publicar RC12.37.17
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js index.html actualizar-ipad.html
          if ! git diff --cached --quiet; then
            git commit -m "RC12.37.17 safe iPad update without erasing offline maps"
            git push origin HEAD:main
          fi
