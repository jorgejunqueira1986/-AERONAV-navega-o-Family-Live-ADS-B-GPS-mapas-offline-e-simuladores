name: AERONAV RC12.37.7 Aircraft Visual Profiles Fix
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  install_visual_profiles:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Apply RC12.37.7
      shell: bash
      run: "set -euo pipefail\ntest -f index.html\ntest -f sw.js\ntest -f flight-camera-director.js\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport base64\n\nh = Path(\"index.html\").read_text(encoding=\"utf-8\")\n\nold_title = \"<title>AERONAV — RC12.37.6</title>\"\nold_app = \"const APP_VERSION = 'RC12.37.6 · Automatic Flight Camera Director';\"\nold_camera = '<script src=\"./flight-camera-director.js?v=RC12.37.6\"></script>'\nnew_visual = '<script src=\"./aircraft-visual-profiles.js?v=RC12.37.7\"></script>'\n\nif old_title not in h:\n    raise SystemExit(\"Expected RC12.37.6 title not found\")\nif old_app not in h:\n    raise SystemExit(\"Expected RC12.37.6 APP_VERSION not found\")\nif old_camera not in h:\n    raise SystemExit(\"RC12.37.6 camera script tag not found\")\n\nh = h.replace(old_title, \"<title>AERONAV — RC12.37.7</title>\", 1)\nh = h.replace(old_app, \"const APP_VERSION = 'RC12.37.7 · Aircraft Visual Profiles';\", 1)\n\nif new_visual not in h:\n    h = h.replace(old_camera, old_camera + \"\\n\" + new_visual, 1)\n\nPath(\"index.html\").write_text(h, encoding=\"utf-8\")\n\njs = base64.b64decode(\"\").decode(\"utf-8\")\nPath(\"aircraft-visual-profiles.js\").write_text(js, encoding=\"utf-8\")\n\ns = Path(\"sw.js\").read_text(encoding=\"utf-8\")\n\nold_header = \"/* AERONAV RC12.37.6 — Automatic Flight Camera Director + versioned offline shell */\"\nold_cache = \"const CACHE='aeronav-jorge-RC12_37_6-auto-flight-cameras-20261008';\"\nold_release = \"release:'RC12.37.6'\"\n\nif old_header not in s:\n    raise SystemExit(\"Expected RC12.37.6 SW header not found\")\nif old_cache not in s:\n    raise SystemExit(\"Expected RC12.37.6 cache not found\")\nif old_release not in s:\n    raise SystemExit(\"Expected RC12.37.6 SW release not found\")\n\ns = s.replace(\n    old_header,\n    \"/* AERONAV RC12.37.7 — Aircraft Visual Profiles + versioned offline shell */\",\n    1\n)\ns = s.replace(\n    old_cache,\n    \"const CACHE='aeronav-jorge-RC12_37_7-aircraft-visuals-20261008';\",\n    1\n)\ns = s.replace(old_release, \"release:'RC12.37.7'\", 1)\n\nlocal_anchor = 'const LOCAL=[\"./flight-camera-director.js\",'\nif local_anchor not in s:\n    raise SystemExit(\"Service Worker LOCAL camera anchor not found\")\nif '\"./aircraft-visual-profiles.js\"' not in s:\n    s = s.replace(\n        local_anchor,\n        'const LOCAL=[\"./aircraft-visual-profiles.js\", \"./flight-camera-director.js\",',\n        1\n    )\n\nPath(\"sw.js\").write_text(s, encoding=\"utf-8\")\nPY\n"
    - name: Validate RC12.37.7
      shell: bash
      run: 'set -euo pipefail

        node --check sw.js

        node --check flight-camera-director.js

        node --check aircraft-visual-profiles.js


        grep -q "<title>AERONAV — RC12.37.7</title>" index.html

        grep -q "const APP_VERSION = ''RC12.37.7 · Aircraft Visual Profiles'';" index.html

        grep -q ''aircraft-visual-profiles.js?v=RC12.37.7'' index.html

        grep -q ''flight-camera-director.js?v=RC12.37.6'' index.html


        grep -q "Cessna 152" aircraft-visual-profiles.js

        grep -q "Cessna 172" aircraft-visual-profiles.js

        grep -q "Dash 8 Q400" aircraft-visual-profiles.js

        grep -q "Boeing 737-700" aircraft-visual-profiles.js

        grep -q "Airbus A220-300" aircraft-visual-profiles.js

        grep -q "Boeing 777-300ER" aircraft-visual-profiles.js

        grep -q "Boeing 787-9" aircraft-visual-profiles.js

        grep -q "Boeing 787-10" aircraft-visual-profiles.js

        grep -q "AERONAVAircraftVisuals" aircraft-visual-profiles.js

        grep -q "TAAG" aircraft-visual-profiles.js


        grep -q "aeronav-jorge-RC12_37_7-aircraft-visuals-20261008" sw.js

        grep -q "release:''RC12.37.7''" sw.js

        grep -q ''"./aircraft-visual-profiles.js"'' sw.js

        '
    - name: Commit RC12.37.7
      shell: bash
      run: "set -euo pipefail\ngit config user.name \"AERONAV Update\"\ngit config user.email \"actions@users.noreply.github.com\"\ngit add index.html sw.js aircraft-visual-profiles.js\n\nif git diff --cached --quiet; then\n  echo \"No changes required.\"\n  exit 0\nfi\n\ngit commit -m \"RC12.37.7 add aircraft visual profiles\"\ngit push origin HEAD:main\n"
