name: AERONAV RC12.37.4 Photorealistic 3D Renderer

'on':
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install_renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply RC12.37.4
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f sw.js
          test -f photo3d-proxy.js
          test -f terrain-photo3d-runtime.js
          test -f drive-core.js

          python3 - <<'PY'
          from pathlib import Path
          import base64

          h = Path("index.html").read_text(encoding="utf-8")

          old_title = "<title>AERONAV — RC12.37.3</title>"
          old_app = "const APP_VERSION = 'RC12.37.3 · Terrain 3D + Photo3D Bridge';"
          if old_title not in h:
              raise SystemExit("Expected RC12.37.3 title not found")
          if old_app not in h:
              raise SystemExit("Expected RC12.37.3 APP_VERSION not found")

          h = h.replace(old_title, "<title>AERONAV — RC12.37.4</title>", 1)
          h = h.replace(
              old_app,
              "const APP_VERSION = 'RC12.37.4 · Photorealistic 3D Renderer';",
              1
          )

          photo = '<script src="./photo3d-proxy.js?v=RC12.37.3"></script>'
          renderer = '<script src="./photo3d-renderer.js?v=RC12.37.4"></script>'
          runtime = '<script src="./terrain-photo3d-runtime.js?v=RC12.37.3"></script>'

          if photo not in h:
              raise SystemExit("photo3d-proxy script tag not found")
          if runtime not in h:
              raise SystemExit("terrain-photo3d-runtime script tag not found")

          if renderer not in h:
              h = h.replace(photo, photo + "\n" + renderer, 1)

          Path("index.html").write_text(h, encoding="utf-8")

          js = base64.b64decode("").decode("utf-8")
          Path("photo3d-renderer.js").write_text(js, encoding="utf-8")

          s = Path("sw.js").read_text(encoding="utf-8")
          old_header = "/* AERONAV RC12.37.3 — Terrain 3D + Photo3D Bridge + versioned offline shell */"
          old_cache = "const CACHE='aeronav-jorge-RC12_37_3-terrain-photo3d-20261008';"
          old_release = "release:'RC12.37.3'"

          if old_header not in s:
              raise SystemExit("Expected RC12.37.3 SW header not found")
          if old_cache not in s:
              raise SystemExit("Expected RC12.37.3 cache not found")
          if old_release not in s:
              raise SystemExit("Expected RC12.37.3 SW release not found")

          s = s.replace(
              old_header,
              "/* AERONAV RC12.37.4 — Photorealistic 3D Renderer + versioned offline shell */",
              1
          )
          s = s.replace(
              old_cache,
              "const CACHE='aeronav-jorge-RC12_37_4-photo3d-renderer-20261008';",
              1
          )
          s = s.replace(old_release, "release:'RC12.37.4'", 1)

          local_anchor = 'const LOCAL=["./terrain-photo3d-runtime.js",'
          if local_anchor not in s:
              raise SystemExit("SW LOCAL anchor not found")
          if '"./photo3d-renderer.js"' not in s:
              s = s.replace(
                  local_anchor,
                  'const LOCAL=["./photo3d-renderer.js", "./terrain-photo3d-runtime.js",',
                  1
              )

          Path("sw.js").write_text(s, encoding="utf-8")
          PY

      - name: Validate RC12.37.4
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check photo3d-proxy.js
          node --check terrain-photo3d-runtime.js
          node --check photo3d-renderer.js

          grep -q "<title>AERONAV — RC12.37.4</title>" index.html
          grep -q "const APP_VERSION = 'RC12.37.4 · Photorealistic 3D Renderer';" index.html
          grep -q 'photo3d-renderer.js?v=RC12.37.4' index.html

          grep -q "aeronav-jorge-RC12_37_4-photo3d-renderer-20261008" sw.js
          grep -q "release:'RC12.37.4'" sw.js
          grep -q '"./photo3d-renderer.js"' sw.js

          grep -q "Cesium3DTileset.fromUrl" photo3d-renderer.js
          grep -q "tile.googleapis.com/v1/3dtiles/root.json" photo3d-renderer.js
          grep -q "AERONAVPhoto3DRenderer" photo3d-renderer.js
          grep -q "Google Photorealistic 3D" photo3d-renderer.js

      - name: Commit RC12.37.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AERONAV Update"
          git config user.email "actions@users.noreply.github.com"

          git add index.html sw.js photo3d-renderer.js

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "RC12.37.4 add Photorealistic 3D renderer"
          git push origin HEAD:main
