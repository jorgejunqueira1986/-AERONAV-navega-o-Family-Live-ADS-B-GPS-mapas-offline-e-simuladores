name: AERONAV RC12.37.10 Vistas Auto Zoom Single Aircraft
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  map_view_controls:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Apply RC12.37.10
      shell: bash
      run: "set -euo pipefail\n\ntest -f index.html\ntest -f sw.js\ntest -f flight-camera-director.js\ntest -f gps-view-modes.js\n\
        test -f cockpit-lite.js\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport base64\n\ndef dec(x):\n    return base64.b64decode(x).decode(\"\
        utf-8\")\n\nh = Path(\"index.html\").read_text(encoding=\"utf-8\")\nold_title = \"<title>AERONAV — RC12.37.9</title>\"\
        \nold_app = \"const APP_VERSION = 'RC12.37.9 · Camera Menu Fix';\"\nanchor = '<script src=\"./flight-camera-ui-fix.js?v=RC12.37.9\"\
        ></script>'\ntag = '<script src=\"./camera-map-behavior.js?v=RC12.37.10\"></script>'\n\nif old_title not in h:\n \
        \   raise SystemExit(\"Expected RC12.37.9 title not found\")\nif old_app not in h:\n    raise SystemExit(\"Expected\
        \ RC12.37.9 APP_VERSION not found\")\nif anchor not in h:\n    raise SystemExit(\"RC12.37.9 UI fix anchor not found\"\
        )\n\nh = h.replace(old_title, \"<title>AERONAV — RC12.37.10</title>\", 1)\nh = h.replace(\n    old_app,\n    \"const\
        \ APP_VERSION = 'RC12.37.10 · Vistas + Auto Zoom + Single Aircraft';\",\n    1\n)\nif tag not in h:\n    h = h.replace(anchor,\
        \ anchor + \"\\n\" + tag, 1)\nPath(\"index.html\").write_text(h, encoding=\"utf-8\")\n\nPath(\"camera-map-behavior.js\"\
        ).write_text(dec(\"\"\
        ), encoding=\"utf-8\")\n\np = Path(\"flight-camera-director.js\")\nc = p.read_text(encoding=\"utf-8\")\nold = dec(\"\
        \"\
        )\nnew = dec(\"\"\
        )\nif old not in c:\n    raise SystemExit(\"Flight Camera targetFor baseline not found\")\nc = c.replace(old, new,\
        \ 1)\np.write_text(c, encoding=\"utf-8\")\n\np = Path(\"gps-view-modes.js\")\ng = p.read_text(encoding=\"utf-8\")\n\
        old = dec(\"ICAgIGlmKG1vZGU9PT0nZmxpZ2h0JyYmTnVtYmVyLmlzRmluaXRlKHdpbmRvdy5fX0FFUk9OQVZfQ09DS1BJVF9QSVRDSF9fKSl7dGFyZ2V0LnBpdGNoPXdpbmRvdy5fX0FFUk9OQVZfQ09DS1BJVF9QSVRDSF9fO3RhcmdldC5wYWRkaW5nPXt0b3A6NTUsYm90dG9tOjcwLGxlZnQ6MTAscmlnaHQ6MTB9O30KICAgIHRyeXttLmVhc2VUbyh0YXJnZXQpO31jYXRjaChfKXt9Cg==\"\
        )\nnew = dec(\"\"\
        )\nif old not in g:\n    raise SystemExit(\"GPS cameraForMode baseline not found\")\ng = g.replace(old, new, 1)\n\
        p.write_text(g, encoding=\"utf-8\")\n\ns = Path(\"sw.js\").read_text(encoding=\"utf-8\")\nold_header = \"/* AERONAV\
        \ RC12.37.9 — Camera Menu Fix + versioned offline shell */\"\nold_cache = \"const CACHE='aeronav-jorge-RC12_37_9-camera-menu-fix-20261008';\"\
        \nold_release = \"release:'RC12.37.9'\"\n\nif old_header not in s:\n    raise SystemExit(\"Expected RC12.37.9 SW header\
        \ not found\")\nif old_cache not in s:\n    raise SystemExit(\"Expected RC12.37.9 cache not found\")\nif old_release\
        \ not in s:\n    raise SystemExit(\"Expected RC12.37.9 SW release not found\")\n\ns = s.replace(\n    old_header,\n\
        \    \"/* AERONAV RC12.37.10 — Vistas + Auto Zoom + Single Aircraft + versioned offline shell */\",\n    1\n)\ns =\
        \ s.replace(\n    old_cache,\n    \"const CACHE='aeronav-jorge-RC12_37_10-map-view-controls-20261008';\",\n    1\n\
        )\ns = s.replace(old_release, \"release:'RC12.37.10'\", 1)\n\nif '\"./camera-map-behavior.js\"' not in s:\n    s =\
        \ s.replace('const LOCAL=[', 'const LOCAL=[\"./camera-map-behavior.js\",', 1)\n\nPath(\"sw.js\").write_text(s, encoding=\"\
        utf-8\")\nPY\n"
    - name: Validate RC12.37.10
      shell: bash
      run: 'set -euo pipefail


        node --check camera-map-behavior.js

        node --check flight-camera-director.js

        node --check gps-view-modes.js

        node --check sw.js


        grep -Fq "<title>AERONAV — RC12.37.10</title>" index.html

        grep -Fq "RC12.37.10 · Vistas + Auto Zoom + Single Aircraft" index.html

        grep -Fq ''camera-map-behavior.js?v=RC12.37.10'' index.html


        grep -Fq "clFlightAngles" camera-map-behavior.js

        grep -Fq "Ângulos de voo" camera-map-behavior.js

        grep -Fq "autoZoomMapBtn" camera-map-behavior.js

        grep -Fq "ZOOM AUTO · ON" camera-map-behavior.js

        grep -Fq "ZOOM AUTO · OFF" camera-map-behavior.js

        grep -Fq "position-marker.flight" camera-map-behavior.js

        grep -Fq "#flightCameraBtn,#mobileFlightCameraBtn" camera-map-behavior.js

        grep -Fq "AERONAVMapViewControls" camera-map-behavior.js


        grep -Fq "aeronav.map.autozoom" flight-camera-director.js

        grep -Fq "aeronav.map.autozoom" gps-view-modes.js


        grep -Fq "aeronav-jorge-RC12_37_10-map-view-controls-20261008" sw.js

        grep -Fq "release:''RC12.37.10''" sw.js

        grep -Fq ''"./camera-map-behavior.js"'' sw.js

        '
    - name: Commit RC12.37.10
      shell: bash
      run: "set -euo pipefail\n\ngit config user.name \"AERONAV Update\"\ngit config user.email \"actions@users.noreply.github.com\"\
        \n\ngit add index.html sw.js flight-camera-director.js gps-view-modes.js camera-map-behavior.js\n\nif git diff --cached\
        \ --quiet; then\n  echo \"No changes required.\"\n  exit 0\nfi\n\ngit commit -m \"RC12.37.10 move angles to Vistas,\
        \ add auto zoom, suppress duplicate aircraft\"\ngit push origin HEAD:main\n"
