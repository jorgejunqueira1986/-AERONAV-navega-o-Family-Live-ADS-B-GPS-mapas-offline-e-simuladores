          ICAgICAgc2V0VGltZW91dCgoKSA9PiBhcHBseVZpZXcoeyBpbnN0YW50OiBmYWxzZSB9KSwgODApOwogICAgfQogIH0sIHRy
          dWUpOwoKICBkb2N1bWVudC5hZGRFdmVudExpc3RlbmVyKCd2aXNpYmlsaXR5Y2hhbmdlJywgKCkgPT4gewogICAgaWYgKCFk
          b2N1bWVudC5oaWRkZW4pIHNldFRpbWVvdXQoKCkgPT4gYXBwbHlWaWV3KHsgaW5zdGFudDogdHJ1ZSB9KSwgMTAwKTsKICB9
          KTsKCiAgc2V0SW50ZXJ2YWwodGljaywgMTIwMCk7CiAgc2V0VGltZW91dCgoKSA9PiB7IHRpY2soKTsgYXBwbHlWaWV3KHsg
          aW5zdGFudDogdHJ1ZSB9KTsgfSwgMzAwKTsKfSkoKTsK
          '''
          drive_core = base64.b64decode(''.join(DRIVE_CORE_B64.split())).decode('utf-8')
          Path('drive-core.js').write_text(drive_core, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('<title>AERONAV — RC12.37.1</title>', '<title>AERONAV — RC12.37.2</title>', 1)
          h = h.replace(
              "const APP_VERSION = 'RC12.37.1 · Service Worker Recovery + Drive 2D/3D';",
              "const APP_VERSION = 'RC12.37.2 · Drive 2D/3D Core Fix';",
              1
          )
          tag = '<script src="./drive-core.js?v=RC12.37.2"></script>'
          if tag not in h:
              anchor = '<script src="./cockpit-lite.js?v=RC12.32"></script>'
              if anchor not in h:
                  raise SystemExit('cockpit-lite anchor not found')
              h = h.replace(anchor, anchor + '\n' + tag, 1)
          index.write_text(h, encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')

          start = s.find('\nconst DRIVE3D_INJECT=`')
          end_marker = '\n\nasync function injectAngolaMapsIntoMainNavigation'
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('DRIVE3D_INJECT block not found')
          s = s[:start] + end_marker + s[end + len(end_marker):]

          line = "    if(!body.includes('data-aeronav-drive3d-rc1237'))body=body.replace(/<\\/body>/i,DRIVE3D_INJECT+'</body>');\n"
          if line not in s:
              raise SystemExit('Drive3D injection line not found')
          s = s.replace(line, '', 1)

          start = s.find('    const drive23dBridge = `')
          end_marker = "    const headers=new Headers(response.headers);"
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('drive23dBridge block not found')
          s = s[:start] + end_marker + s[end + len(end_marker):]

          s = s.replace(
              '/* AERONAV RC12.37.1 — Service Worker Recovery + Drive 2D/3D functional hotfix */',
              '/* AERONAV RC12.37.2 — Drive 2D/3D Core Fix + versioned offline shell */',
              1
          )
          s = s.replace(
              "const CACHE='aeronav-jorge-RC12_37_1-drive2d3d-hotfix-20261007';",
              "const CACHE='aeronav-jorge-RC12_37_2-drive-core-20261008';",
              1
          )
          s = s.replace("release:'RC12.37.1'", "release:'RC12.37.2'", 1)

          local_anchor = 'const LOCAL=["./cockpit-lite.js",'
          if '"./drive-core.js"' not in s:
              if local_anchor not in s:
                  raise SystemExit('LOCAL cache anchor not found')
              s = s.replace(local_anchor, 'const LOCAL=["./drive-core.js", "./cockpit-lite.js",', 1)

          forbidden = ('DRIVE3D_INJECT', 'drive23dBridge', 'data-aeronav-drive3d-rc1237', 'data-aeronav-drive23d-rc12371')
          if any(x in s for x in forbidden):
              raise SystemExit('old Drive hotfix remains in sw.js')

          sw.write_text(s, encoding='utf-8')
          PY

      - name: Validate result
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check drive-core.js
          grep -Fq "AERONAV — RC12.37.2" index.html
          grep -Fq "RC12.37.2 · Drive 2D/3D Core Fix" index.html
          grep -Fq '<script src="./drive-core.js?v=RC12.37.2"></script>' index.html
          grep -Fq "aeronav-jorge-RC12_37_2-drive-core-20261008" sw.js
          grep -Fq "release:'RC12.37.2'" sw.js
          grep -Fq '"./drive-core.js"' sw.js
          ! grep -Fq "DRIVE3D_INJECT" sw.js
          ! grep -Fq "drive23dBridge" sw.js
          ! grep -Fq "data-aeronav-drive3d-rc1237" sw.js
          ! grep -Fq "data-aeronav-drive23d-rc12371" sw.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AERONAV Update"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js drive-core.js
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "RC12.37.2 Drive 2D 3D core fix"
          git push origin HEAD:main
