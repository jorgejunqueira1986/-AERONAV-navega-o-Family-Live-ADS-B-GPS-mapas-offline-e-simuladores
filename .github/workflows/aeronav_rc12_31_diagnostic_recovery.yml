name: AERONAV RC12.31 Diagnostic Recovery
on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/aeronav_rc12_31_diagnostic_recovery.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current AERONAV
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install RC12.31 diagnostic recovery
        shell: bash
        run: |
          echo '' | base64 -d > diagnostic-recovery.js
          echo '' | base64 -d > sw.js
      - name: Validate RC12.31
        shell: bash
        run: |
          node --check diagnostic-recovery.js
          node --check sw.js
          grep -q "__AERONAV_DIAGNOSTIC_RC1231" diagnostic-recovery.js
          grep -q "aeronav-jorge-RC12_31-diagnostic-recovery-20261001-1" sw.js
          grep -q "diagnostic-recovery.js?v=RC12.31" sw.js
          grep -q "data-aeronav-rc1231-mapbridge" sw.js
          grep -q "cache:'no-store'" sw.js
          grep -q "AERONAV Angola fragment unavailable" sw.js
      - name: Commit RC12.31
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-recovery.js sw.js
          if git diff --cached --quiet; then echo "RC12.31 already applied"; exit 0; fi
          git commit -m "AERONAV RC12.31 diagnostic recovery"
          git push
