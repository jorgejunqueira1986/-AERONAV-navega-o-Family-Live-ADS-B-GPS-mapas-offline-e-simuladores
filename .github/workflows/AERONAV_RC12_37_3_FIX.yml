name: AERONAV RC12.37.3 Terrain Photo3D Fix

'on':
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply_fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply RC12.37.3
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f sw.js
          test -f drive-core.js
          test -f photo3d-proxy.js

          python3 - <<'PY'
          from pathlib import Path
          import base64

          h = Path("index.html").read_text(encoding="utf-8")

          expected_title = "<title>AERONAV — RC12.37.2</title>"
          expected_app = "const APP_VERSION = 'RC12.37.2 · Drive 2D/3D Core Fix';"
          anchor = "\n\n  function angolaSafeLayerId(s)"

          if expected_title not in h:
              raise SystemExit("Expected RC12.37.2 title not found")
          if expected_app not in h:
              raise SystemExit("Expected RC12.37.2 APP_VERSION not found")
          if "async function angolaApplyTerrain()" not in h:
              raise SystemExit("angolaApplyTerrain not found")
          if anchor not in h:
              raise SystemExit("Terrain bridge anchor not found")

          bridge = base64.b64decode("").decode("utf-8")
          if "window.AERONAVTerrainBridge=" not in h:
              h = h.replace(anchor, "\n" + bridge + anchor, 1)

          h = h.replace(expected_title, "<title>AERONAV — RC12.37.3</title>", 1)
          h = h.replace(
              expected_app,
              "const APP_VERSION = 'RC12.37.3 · Terrain 3D + Photo3D Bridge';",
              1
          )

          drive = '<script src="./drive-core.js?v=RC12.37.2"></script>'
          photo = '<script src="./photo3d-proxy.js?v=RC12.37.3"></script>'
          runtime = '<script src="./terrain-photo3d-runtime.js?v=RC12.37.3"></script>'

          if drive not in h:
              raise SystemExit("drive-core script tag not found")

          if photo not in h:
              h = h.replace(drive, photo + "\n" + runtime + "\n" + drive, 1)
          elif runtime not in h:
              h = h.replace(photo, photo + "\n" + runtime, 1)

          Path("index.html").write_text(h, encoding="utf-8")

          runtime_js = base64.b64decode("").decode("utf-8")
          Path("terrain-photo3d-runtime.js").write_text(runtime_js, encoding="utf-8")

          s = Path("sw.js").read_text(encoding="utf-8")

          old_header = "/* AERONAV RC12.37.2 — Drive 2D/3D Core Fix + versioned offline shell */"
          old_cache = "const CACHE='aeronav-jorge-RC12_37_2-drive-core-20261008';"
          old_release = "release:'RC12.37.2'"

          if old_header not in s:
              raise SystemExit("Expected RC12.37.2 SW header not found")
          if old_cache not in s:
              raise SystemExit("Expected RC12.37.2 cache not found")
          if old_release not in s:
              raise SystemExit("Expected RC12.37.2 SW release not found")

          s = s.replace(
              old_header,
              "/* AERONAV RC12.37.3 — Terrain 3D + Photo3D Bridge + versioned offline shell */",
              1
          )
          s = s.replace(
              old_cache,
              "const CACHE='aeronav-jorge-RC12_37_3-terrain-photo3d-20261008';",
              1
          )
          s = s.replace(old_release, "release:'RC12.37.3'", 1)

          local_anchor = 'const LOCAL=["./drive-core.js",'
          if local_anchor not in s:
              raise SystemExit("SW LOCAL anchor not found")
          if '"./terrain-photo3d-runtime.js"' not in s:
              s = s.replace(
                  local_anchor,
                  'const LOCAL=["./terrain-photo3d-runtime.js", "./photo3d-proxy.js", "./drive-core.js",',
                  1
              )

          Path("sw.js").write_text(s, encoding="utf-8")
          PY

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check photo3d-proxy.js
          node --check terrain-photo3d-runtime.js

          grep -q "<title>AERONAV — RC12.37.3</title>" index.html
          grep -q "const APP_VERSION = 'RC12.37.3 · Terrain 3D + Photo3D Bridge';" index.html
          grep -q "window.AERONAVTerrainBridge=" index.html
          grep -q 'photo3d-proxy.js?v=RC12.37.3' index.html
          grep -q 'terrain-photo3d-runtime.js?v=RC12.37.3' index.html

          grep -q "aeronav-jorge-RC12_37_3-terrain-photo3d-20261008" sw.js
          grep -q "release:'RC12.37.3'" sw.js
          grep -q '"./photo3d-proxy.js"' sw.js
          grep -q '"./terrain-photo3d-runtime.js"' sw.js

      - name: Commit RC12.37.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AERONAV Update"
          git config user.email "actions@users.noreply.github.com"

          git add index.html sw.js terrain-photo3d-runtime.js

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "RC12.37.3 Terrain 3D and Photo3D bridge"
          git push origin HEAD:main
