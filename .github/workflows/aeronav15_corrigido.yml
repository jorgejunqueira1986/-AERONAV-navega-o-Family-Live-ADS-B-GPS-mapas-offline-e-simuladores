          PAYLOAD
          echo '6b86e66b1b7204d71a3d528b3eebd354efdf8bff4ead4f17e8b0300ac166733b  /tmp/aeronav15-assets.tar.gz' | sha256sum -c -
          tar -xzf /tmp/aeronav15-assets.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          html=Path('index.html');html_text=html.read_text(encoding='utf-8')
          script='<script src="./flight-angle-photo-renderer.js?v=RC12.37.15"></script>'
          anchor='<script src="./aircraft-perspective-viewer.js?v=RC12.37.14"></script>'
          if script not in html_text:
              assert html_text.count(anchor)==1,'Não encontrou ponto de inserção do novo renderizador'
              html_text=html_text.replace(anchor,anchor+'\n'+script)
          html_text=re.sub(r'<title>AERONAV — RC[^<]+</title>','<title>AERONAV — RC12.37.15</title>',html_text,count=1)
          html_text=re.sub(r"const APP_VERSION = '[^']+';","const APP_VERSION = 'RC12.37.15 · Fotografias TAAG';",html_text,count=1)
          html.write_text(html_text,encoding='utf-8')
          sw_path=Path('sw.js');sw=sw_path.read_text(encoding='utf-8')
          match=re.search(r'const LOCAL=(\[[^\n]*\]);',sw)
          assert match,'Lista de cache offline não encontrada'
          old=json.loads(match.group(1))
          needed=['./flight-angle-photo-renderer.js']+[f'./assets/flight-angle-renders/b777300/{name}' for name in ['behind.webp','left.webp','right.webp','top.webp','inclined.webp','cockpit_live.webp']]
          new=needed+[p for p in old if p not in needed]
          sw=sw[:match.start(1)]+json.dumps(new,ensure_ascii=False,separators=(',',':'))+sw[match.end(1):]
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='aeronav-jorge-RC12_37_15-taag-photo-angles-20261008';",sw,count=1)
          sw=sw.replace("release:'RC12.37.14'","release:'RC12.37.15'")
          sw_path.write_text(sw,encoding='utf-8')
          print('OK: index.html e sw.js atualizados; álbuns B777-300ER em cache offline')
          PY
      - name: Validar versao, sintaxe e imagens
        shell: bash
        run: |
          set -euo pipefail
          node --check flight-angle-photo-renderer.js
          grep -q 'RC12.37.15' index.html
          grep -q 'flight-angle-photo-renderer.js?v=RC12.37.15' index.html
          grep -q 'RC12_37_15' sw.js
          python3 - <<'PY'
          from pathlib import Path
          paths=['behind','left','right','top','inclined','cockpit_live']
          for name in paths:
                p=Path('assets/flight-angle-renders/b777300') / (name+'.webp')
                assert p.is_file() and p.read_bytes()[:4]==b'RIFF' and p.read_bytes()[8:12]==b'WEBP',f'WebP invalido: {p}'
                print('OK',p,p.stat().st_size)
          assert 'aircraft-perspective-viewer.js?v=RC12.37.14' in Path('index.html').read_text()
          print('OK: motor 3D original preservado para orbita e outras aeronaves')
          PY
      - name: Publicar RC12.37.15 na branch main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AERONAV Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js flight-angle-photo-renderer.js assets/flight-angle-renders/b777300
          if git diff --cached --quiet; then
            echo 'Sem alteracoes: RC12.37.15 ja instalada.'
          else
            git commit -m 'RC12.37.15 photos TAAG 777 aircraft-only views'
            git push origin HEAD:main
          fi
