name: AERONAV RC12.31.1 Lightweight Diagnostic Hotfix
on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/aeronav_rc12_31_1_lightweight_hotfix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current AERONAV
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install lightweight diagnostic
        shell: bash
        run: |
          echo '' | base64 -d > diagnostic-recovery.js
      - name: Validate RC12.31.1
        shell: bash
        run: |
          node --check diagnostic-recovery.js
          ! grep -q "setInterval(()=>refresh" diagnostic-recovery.js
          grep -q "RC12.31.1" diagnostic-recovery.js
          grep -q "Modo leve" diagnostic-recovery.js
      - name: Commit RC12.31.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-recovery.js
          if git diff --cached --quiet; then echo "RC12.31.1 already applied"; exit 0; fi
          git commit -m "AERONAV RC12.31.1 lightweight diagnostic hotfix"
          git push
