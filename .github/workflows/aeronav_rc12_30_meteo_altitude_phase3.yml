name: AERONAV RC12.30 Meteo Altitude Phase 3
on:
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/aeronav_rc12_30_meteo_altitude_phase3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout current AERONAV
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Phase 3
      shell: bash
      run: 'echo '''' | base64 -d > meteo-altitude-phase3.js

        echo '''' | base64 -d > /tmp/aeronav_rc1230_patch.py

        python3 /tmp/aeronav_rc1230_patch.py'
    - name: Validate RC12.30
      shell: bash
      run: 'node --check meteo-altitude-phase3.js

        node --check sw.js

        grep -q ''meteo-altitude-phase3.js'' sw.js

        grep -q ''FL WX'' meteo-altitude-phase3.js

        grep -q ''TURB POT.'' meteo-altitude-phase3.js

        grep -q ''ICING POT.'' meteo-altitude-phase3.js

        grep -q ''freezing_level_height'' meteo-altitude-phase3.js

        grep -q ''cape'' meteo-altitude-phase3.js'
    - name: Commit RC12.30
      shell: bash
      run: 'git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add meteo-altitude-phase3.js sw.js

        if git diff --cached --quiet; then echo "RC12.30 already applied"; exit 0; fi

        git commit -m "AERONAV RC12.30 altitude weather phase 3"

        git push'
