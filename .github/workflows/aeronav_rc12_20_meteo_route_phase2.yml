name: AERONAV RC12.20 Meteo Route Phase 2
on:
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/aeronav_rc12_20_meteo_route_phase2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout current AERONAV
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Phase 2
      shell: bash
      run: 'echo '''' | base64 -d > meteo-route-phase2.js

        echo '''' | base64 -d > /tmp/aeronav_rc1220_patch.py

        python3 /tmp/aeronav_rc1220_patch.py'
    - name: Validate RC12.20
      shell: bash
      run: 'node --check meteo-route-phase2.js

        node --check sw.js

        grep -q ''meteo-route-phase2.js'' sw.js

        grep -q ''WX ROUTE · FASE 2'' meteo-route-phase2.js

        grep -q ''SAMPLE_COUNT=7'' meteo-route-phase2.js

        grep -q ''TROVOADA'' meteo-route-phase2.js'
    - name: Commit RC12.20
      shell: bash
      run: 'git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add meteo-route-phase2.js sw.js

        if git diff --cached --quiet; then echo "RC12.20 already applied"; exit 0; fi

        git commit -m "AERONAV RC12.20 route weather phase 2"

        git push'
