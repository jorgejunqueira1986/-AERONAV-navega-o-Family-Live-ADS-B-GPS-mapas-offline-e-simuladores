name: AERONAV RC12.37.5 Manual Flight Cameras

'on':
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  install_cameras:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply RC12.37.5
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f sw.js
          test -f gps-view-modes.js
          test -f cockpit-lite.js
          test -f photo3d-renderer.js

          python3 - <<'PY'
          from pathlib import Path
          import base64

          h = Path("index.html").read_text(encoding="utf-8")
          old_title = "<title>AERONAV — RC12.37.4</title>"
          old_app = "const APP_VERSION = 'RC12.37.4 · Photorealistic 3D Renderer';"

          if old_title not in h:
              raise SystemExit("Expected RC12.37.4 title not found")
          if old_app not in h:
              raise SystemExit("Expected RC12.37.4 APP_VERSION not found")

          h = h.replace(old_title, "<title>AERONAV — RC12.37.5</title>", 1)
          h = h.replace(
              old_app,
              "const APP_VERSION = 'RC12.37.5 · Manual Flight Camera Director';",
              1
          )

          cockpit = '<script src="./cockpit-lite.js?v=RC12.32"></script>'
          camera = '<script src="./flight-camera-director.js?v=RC12.37.5"></script>'
          if cockpit not in h:
              raise SystemExit("cockpit-lite script anchor not found")
          if camera not in h:
              h = h.replace(cockpit, cockpit + "\n" + camera, 1)

          gps_old = '<script src="./gps-view-modes.js?v=RC12.36"></script>'
          gps_new = '<script src="./gps-view-modes.js?v=RC12.37.5"></script>'
          if gps_old in h:
              h = h.replace(gps_old, gps_new, 1)

          Path("index.html").write_text(h, encoding="utf-8")

          camera_js = base64.b64decode("").decode("utf-8")
          Path("flight-camera-director.js").write_text(camera_js, encoding="utf-8")

          gps_path = Path("gps-view-modes.js")
          g = gps_path.read_text(encoding="utf-8")
          anchor = "  function cameraForMode(force=false){\n"
          guard = "    if(mode==='flight'&&window.__AERONAV_FLIGHT_CAMERA_DIRECTOR_ACTIVE__)return;\n"
          if anchor not in g:
              raise SystemExit("gps-view-modes cameraForMode anchor not found")
          if "__AERONAV_FLIGHT_CAMERA_DIRECTOR_ACTIVE__" not in g:
              g = g.replace(anchor, anchor + guard, 1)
          gps_path.write_text(g, encoding="utf-8")

          s = Path("sw.js").read_text(encoding="utf-8")
          old_header = "/* AERONAV RC12.37.4 — Photorealistic 3D Renderer + versioned offline shell */"
          old_cache = "const CACHE='aeronav-jorge-RC12_37_4-photo3d-renderer-20261008';"
          old_release = "release:'RC12.37.4'"

          if old_header not in s:
              raise SystemExit("Expected RC12.37.4 SW header not found")
          if old_cache not in s:
              raise SystemExit("Expected RC12.37.4 cache not found")
          if old_release not in s:
              raise SystemExit("Expected RC12.37.4 SW release not found")

          s = s.replace(
              old_header,
              "/* AERONAV RC12.37.5 — Manual Flight Camera Director + versioned offline shell */",
              1
          )
          s = s.replace(
              old_cache,
              "const CACHE='aeronav-jorge-RC12_37_5-flight-cameras-20261008';",
              1
          )
          s = s.replace(old_release, "release:'RC12.37.5'", 1)

          local_anchor = 'const LOCAL=["./photo3d-renderer.js",'
          if local_anchor not in s:
              raise SystemExit("SW LOCAL anchor not found")
          if '"./flight-camera-director.js"' not in s:
              s = s.replace(
                  local_anchor,
                  'const LOCAL=["./flight-camera-director.js", "./photo3d-renderer.js",',
                  1
              )

          Path("sw.js").write_text(s, encoding="utf-8")
          PY

      - name: Validate RC12.37.5
        shell: bash
        run: |
          set -euo pipefail
          node --check sw.js
          node --check gps-view-modes.js
          node --check flight-camera-director.js

          grep -q "<title>AERONAV — RC12.37.5</title>" index.html
          grep -q "const APP_VERSION = 'RC12.37.5 · Manual Flight Camera Director';" index.html
          grep -q 'flight-camera-director.js?v=RC12.37.5' index.html
          grep -q 'gps-view-modes.js?v=RC12.37.5' index.html

          grep -q "__AERONAV_FLIGHT_CAMERA_DIRECTOR_ACTIVE__" gps-view-modes.js
          grep -q "AERONAVFlightCamera" flight-camera-director.js
          grep -q "ÓRBITA 360°" flight-camera-director.js
          grep -q "LADO ESQUERDO" flight-camera-director.js
          grep -q "LADO DIREITO" flight-camera-director.js
          grep -q "COCKPIT" flight-camera-director.js
          grep -q "automatic:false" flight-camera-director.js

          grep -q "aeronav-jorge-RC12_37_5-flight-cameras-20261008" sw.js
          grep -q "release:'RC12.37.5'" sw.js
          grep -q '"./flight-camera-director.js"' sw.js

      - name: Commit RC12.37.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AERONAV Update"
          git config user.email "actions@users.noreply.github.com"

          git add index.html sw.js gps-view-modes.js flight-camera-director.js

          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi

          git commit -m "RC12.37.5 add manual flight camera director"
          git push origin HEAD:main
