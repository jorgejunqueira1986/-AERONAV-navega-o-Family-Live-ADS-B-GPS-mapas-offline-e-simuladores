name: AERONAV RC12.37.8 True 3D Aircraft Models FIX
'on':
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  install_aircraft3d:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Apply RC12.37.8
      shell: bash
      run: "set -euo pipefail\ntest -f index.html\ntest -f sw.js\ntest -f photo3d-renderer.js\ntest -f flight-camera-director.js\n\
        test -f aircraft-visual-profiles.js\n\npython3 - <<'PY'\nfrom pathlib import Path\nimport base64\n\nh=Path(\"index.html\"\
        ).read_text(encoding=\"utf-8\")\nfor needle in [\n    \"<title>AERONAV — RC12.37.7</title>\",\n    \"const APP_VERSION\
        \ = 'RC12.37.7 · Aircraft Visual Profiles';\",\n    '<script src=\"./photo3d-renderer.js?v=RC12.37.4\"></script>',\n\
        \    '<script src=\"./aircraft-visual-profiles.js?v=RC12.37.7\"></script>'\n]:\n    if needle not in h:\n        raise\
        \ SystemExit(\"Baseline não encontrado: \"+needle)\n\nh=h.replace(\"<title>AERONAV — RC12.37.7</title>\",\"<title>AERONAV\
        \ — RC12.37.8</title>\",1)\nh=h.replace(\"const APP_VERSION = 'RC12.37.7 · Aircraft Visual Profiles';\",\"const APP_VERSION\
        \ = 'RC12.37.8 · True 3D Aircraft Models';\",1)\nh=h.replace('<script src=\"./photo3d-renderer.js?v=RC12.37.4\"></script>','<script\
        \ src=\"./photo3d-renderer.js?v=RC12.37.8\"></script>',1)\n\ntag='<script src=\"./aircraft-3d-models.js?v=RC12.37.8\"\
        ></script>'\nif tag not in h:\n    h=h.replace('<script src=\"./photo3d-renderer.js?v=RC12.37.8\"></script>','<script\
        \ src=\"./photo3d-renderer.js?v=RC12.37.8\"></script>\\n'+tag,1)\nPath(\"index.html\").write_text(h,encoding=\"utf-8\"\
        )\n\np=Path(\"photo3d-renderer.js\")\nc=p.read_text(encoding=\"utf-8\")\nsync_old=\"  function syncCamera(force =\
        \ false) {\\n    if (!runtime.enabled || !runtime.viewer || !runtime.ready || !mapScreenActive()) return;\"\nsync_new=\"\
        \  function syncCamera(force = false) {\\n    if (window.__AERONAV_3D_AIRCRAFT_CAMERA_OVERRIDE__) return;\\n    if\
        \ (!runtime.enabled || !runtime.viewer || !runtime.ready || !mapScreenActive()) return;\"\nif sync_old not in c:\n\
        \    raise SystemExit(\"Photo3D syncCamera baseline não encontrado\")\nif \"__AERONAV_3D_AIRCRAFT_CAMERA_OVERRIDE__\"\
        \ not in c:\n    c=c.replace(sync_old,sync_new,1)\n\napi_old=\"window.AERONAVPhoto3DRenderer = { enable, disable,\
        \ toggle, status, sync: () => syncCamera(true) };\"\napi_new=\"window.AERONAVPhoto3DRenderer = { enable, disable,\
        \ toggle, status, sync: () => syncCamera(true), viewer: () => runtime.viewer };\"\nif api_old not in c:\n    raise\
        \ SystemExit(\"Photo3D API baseline não encontrado\")\nc=c.replace(api_old,api_new,1)\nc=c.replace(\"release: 'RC12.37.4'\"\
        ,\"release: 'RC12.37.8'\",1)\np.write_text(c,encoding=\"utf-8\")\n\nPath(\"aircraft-3d-models.js\").write_text(base64.b64decode(\"\
        \"\
        ).decode(\"utf-8\"),encoding=\"utf-8\")\nPY\n\npython3 - <<'PY'\n\nfrom pathlib import Path\nimport math, struct,\
        \ json\n\nOUT = Path(\"assets/aircraft3d\")\nOUT.mkdir(parents=True, exist_ok=True)\n\nMATERIALS = [\n    {\"name\"\
        :\"White\",\"pbrMetallicRoughness\":{\"baseColorFactor\":[0.96,0.96,0.98,1],\"metallicFactor\":0.05,\"roughnessFactor\"\
        :0.68},\"extensions\":{\"KHR_materials_unlit\":{}}},\n    {\"name\":\"Red\",\"pbrMetallicRoughness\":{\"baseColorFactor\"\
        :[0.78,0.01,0.03,1],\"metallicFactor\":0.02,\"roughnessFactor\":0.72},\"extensions\":{\"KHR_materials_unlit\":{}}},\n\
        \    {\"name\":\"Orange\",\"pbrMetallicRoughness\":{\"baseColorFactor\":[0.96,0.25,0.02,1],\"metallicFactor\":0.02,\"\
        roughnessFactor\":0.72},\"extensions\":{\"KHR_materials_unlit\":{}}},\n    {\"name\":\"Dark\",\"pbrMetallicRoughness\"\
        :{\"baseColorFactor\":[0.06,0.08,0.10,1],\"metallicFactor\":0.1,\"roughnessFactor\":0.55},\"extensions\":{\"KHR_materials_unlit\"\
        :{}}},\n    {\"name\":\"Glass\",\"pbrMetallicRoughness\":{\"baseColorFactor\":[0.03,0.18,0.28,1],\"metallicFactor\"\
        :0.0,\"roughnessFactor\":0.25},\"extensions\":{\"KHR_materials_unlit\":{}}},\n]\n\nAIRCRAFT = {\n    \"c152\":   \
        \ dict(name=\"Cessna 152\", length=7.3, span=10.2, radius=.48, wing_chord=1.55, tail_span=3.5, tail_chord=.8, tail_height=1.35,\
        \ kind=\"prop\", high_wing=True, prop_span=1.7),\n    \"c172\":    dict(name=\"Cessna 172\", length=8.3, span=11.0,\
        \ radius=.54, wing_chord=1.75, tail_span=3.8, tail_chord=.9, tail_height=1.45, kind=\"prop\", high_wing=True, prop_span=1.9),\n\
        \    \"q400\":    dict(name=\"De Havilland Dash 8 Q400\", length=32.8, span=28.4, radius=1.45, wing_chord=4.0, tail_span=10.0,\
        \ tail_chord=2.2, tail_height=4.5, kind=\"turboprop\", high_wing=True, engine_y=6.0, engine_r=.75, prop_span=4.1),\n\
        \    \"b7377\":   dict(name=\"Boeing 737-700\", length=33.6, span=35.8, radius=1.75, wing_chord=5.1, tail_span=11.2,\
        \ tail_chord=2.5, tail_height=5.0, kind=\"jet\", high_wing=False, engine_y=6.7, engine_r=1.05),\n    \"a2203\":  \
        \ dict(name=\"Airbus A220-300\", length=38.7, span=35.1, radius=1.85, wing_chord=5.6, tail_span=11.6, tail_chord=2.7,\
        \ tail_height=5.3, kind=\"jet\", high_wing=False, engine_y=6.9, engine_r=1.18),\n    \"b777300\": dict(name=\"Boeing\
        \ 777-300ER\", length=73.9, span=64.8, radius=3.1, wing_chord=9.4, tail_span=21.0, tail_chord=4.5, tail_height=8.2,\
        \ kind=\"jet\", high_wing=False, engine_y=13.0, engine_r=2.1),\n    \"b7879\":   dict(name=\"Boeing 787-9\", length=62.8,\
        \ span=60.1, radius=2.8, wing_chord=8.5, tail_span=19.2, tail_chord=4.0, tail_height=7.4, kind=\"jet\", high_wing=False,\
        \ engine_y=12.0, engine_r=1.85),\n    \"b78710\":  dict(name=\"Boeing 787-10\", length=68.3, span=60.1, radius=2.85,\
        \ wing_chord=8.7, tail_span=19.4, tail_chord=4.1, tail_height=7.5, kind=\"jet\", high_wing=False, engine_y=12.2, engine_r=1.88),\n\
        }\n\ndef make_glb(key, p, path):\n    primitives, views, accessors = [], [], []\n    buffer = bytearray()\n\n    def\
        \ add_primitive(verts, inds, mat):\n        nonlocal buffer\n        while len(buffer) % 4: buffer += b\"\\x00\"\n\
        \        poff = len(buffer)\n        pdata = b\"\".join(struct.pack(\"<3f\", *v) for v in verts)\n        buffer +=\
        \ pdata\n        pview = len(views)\n        views.append({\"buffer\":0,\"byteOffset\":poff,\"byteLength\":len(pdata),\"\
        target\":34962})\n        xs=[v[0] for v in verts]; ys=[v[1] for v in verts]; zs=[v[2] for v in verts]\n        pacc\
        \ = len(accessors)\n        accessors.append({\"bufferView\":pview,\"componentType\":5126,\"count\":len(verts),\"\
        type\":\"VEC3\",\n                          \"min\":[min(xs),min(ys),min(zs)],\"max\":[max(xs),max(ys),max(zs)]})\n\
        \        while len(buffer) % 4: buffer += b\"\\x00\"\n        ioff = len(buffer)\n        idata = b\"\".join(struct.pack(\"\
        <H\", i) for i in inds)\n        buffer += idata\n        iview = len(views)\n        views.append({\"buffer\":0,\"\
        byteOffset\":ioff,\"byteLength\":len(idata),\"target\":34963})\n        iacc = len(accessors)\n        accessors.append({\"\
        bufferView\":iview,\"componentType\":5123,\"count\":len(inds),\"type\":\"SCALAR\"})\n        primitives.append({\"\
        attributes\":{\"POSITION\":pacc},\"indices\":iacc,\"material\":mat})\n\n    def box(cx,cy,cz,sx,sy,sz,mat):\n    \
        \    x0,x1=cx-sx/2,cx+sx/2; y0,y1=cy-sy/2,cy+sy/2; z0,z1=cz-sz/2,cz+sz/2\n        v=[(x0,y0,z0),(x1,y0,z0),(x1,y1,z0),(x0,y1,z0),(x0,y0,z1),(x1,y0,z1),(x1,y1,z1),(x0,y1,z1)]\n\
        \        i=[0,1,2,0,2,3,4,6,5,4,7,6,0,4,5,0,5,1,1,5,6,1,6,2,2,6,7,2,7,3,3,7,4,3,4,0]\n        add_primitive(v,i,mat)\n\
        \n    def prism_x(x0,x1,cy,cz,ry,rz,mat,n=12):\n        v=[]\n        for x in (x0,x1):\n            for k in range(n):\n\
        \                a=2*math.pi*k/n\n                v.append((x,cy+math.cos(a)*ry,cz+math.sin(a)*rz))\n        i=[]\n\
        \        for k in range(n):\n            j=(k+1)%n\n            i += [k,j,n+j,k,n+j,n+k]\n        c0=len(v); v.append((x0,cy,cz))\n\
        \        c1=len(v); v.append((x1,cy,cz))\n        for k in range(n):\n            j=(k+1)%n\n            i += [c0,j,k,c1,n+k,n+j]\n\
        \        add_primitive(v,i,mat)\n\n    L=p[\"length\"]; span=p[\"span\"]; r=p[\"radius\"]\n    prism_x(-L/2,L/2,0,0,r,r*.90,0,14)\n\
        \    prism_x(L*.22,L*.46,0,r*.12,r*1.01,r*.82,4,12)\n\n    wing_z = r*.68 if p[\"high_wing\"] else -r*.10\n    box(-L*.02,0,wing_z,p[\"\
        wing_chord\"],span,max(.08,r*.13),0)\n    box(-L*.39,0,r*.12,p[\"tail_chord\"],p[\"tail_span\"],max(.06,r*.09),0)\n\
        \    box(-L*.405,0,r+p[\"tail_height\"]/2,p[\"tail_chord\"]*.72,max(.07,r*.13),p[\"tail_height\"],1)\n    box(-L*.08,-r*.98,r*.05,L*.62,max(.03,r*.06),max(.04,r*.10),2)\n\
        \n    if p[\"kind\"] == \"prop\":\n        nose=L/2+.12\n        box(nose,0,0,.10,p[\"prop_span\"],.08,3)\n      \
        \  box(nose,0,0,.10,.08,p[\"prop_span\"],3)\n    elif p[\"kind\"] == \"turboprop\":\n        for y in (-p[\"engine_y\"\
        ],p[\"engine_y\"]):\n            prism_x(-L*.02,L*.13,y,wing_z-r*.55,p[\"engine_r\"],p[\"engine_r\"]*.9,3,10)\n  \
        \          px=L*.14\n            box(px,y,wing_z-r*.55,.12,p[\"prop_span\"],.10,3)\n            box(px,y,wing_z-r*.55,.12,.10,p[\"\
        prop_span\"],3)\n    else:\n        for y in (-p[\"engine_y\"],p[\"engine_y\"]):\n            prism_x(-L*.02,L*.14,y,wing_z-r*.72,p[\"\
        engine_r\"],p[\"engine_r\"]*.92,3,12)\n\n    if key.startswith(\"b787\"):\n        box(-L*.05,-span*.43,wing_z+.02,p[\"\
        wing_chord\"]*.45,span*.14,max(.06,r*.08),0)\n        box(-L*.05, span*.43,wing_z+.02,p[\"wing_chord\"]*.45,span*.14,max(.06,r*.08),0)\n\
        \    elif key==\"b777300\":\n        box(-L*.06,-span*.46,wing_z+.02,p[\"wing_chord\"]*.34,span*.09,max(.07,r*.07),0)\n\
        \        box(-L*.06, span*.46,wing_z+.02,p[\"wing_chord\"]*.34,span*.09,max(.07,r*.07),0)\n\n    doc={\"asset\":{\"\
        version\":\"2.0\",\"generator\":\"AERONAV RC12.37.8 procedural aircraft\"},\n         \"extensionsUsed\":[\"KHR_materials_unlit\"\
        ],\"scene\":0,\"scenes\":[{\"nodes\":[0]}],\n         \"nodes\":[{\"mesh\":0,\"name\":p[\"name\"]}],\"meshes\":[{\"\
        name\":p[\"name\"],\"primitives\":primitives}],\n         \"materials\":MATERIALS,\"buffers\":[{\"byteLength\":len(buffer)}],\n\
        \         \"bufferViews\":views,\"accessors\":accessors}\n\n    j=json.dumps(doc,separators=(\",\",\":\"),ensure_ascii=False).encode(\"\
        utf-8\")\n    while len(j)%4: j+=b\" \"\n    b=bytes(buffer)\n    while len(b)%4: b+=b\"\\x00\"\n    total=12+8+len(j)+8+len(b)\n\
        \n    out=bytearray()\n    out += b\"glTF\" + struct.pack(\"<II\",2,total)\n    out += struct.pack(\"<I4s\",len(j),b\"\
        JSON\") + j\n    out += struct.pack(\"<I4s\",len(b),b\"BIN\\x00\") + b\n    path.write_bytes(out)\n\nfor key,p in\
        \ AIRCRAFT.items():\n    make_glb(key,p,OUT/f\"{key}.glb\")\n\nPY\n\npython3 - <<'PY'\nfrom pathlib import Path\n\n\
        s=Path(\"sw.js\").read_text(encoding=\"utf-8\")\nfor needle in [\n    \"/* AERONAV RC12.37.7 — Aircraft Visual Profiles\
        \ + versioned offline shell */\",\n    \"const CACHE='aeronav-jorge-RC12_37_7-aircraft-visuals-20261008';\",\n   \
        \ \"release:'RC12.37.7'\",\n    'const LOCAL=[\"./aircraft-visual-profiles.js\",'\n]:\n    if needle not in s:\n \
        \       raise SystemExit(\"SW baseline não encontrado: \"+needle)\n\ns=s.replace(\"/* AERONAV RC12.37.7 — Aircraft\
        \ Visual Profiles + versioned offline shell */\",\n            \"/* AERONAV RC12.37.8 — True 3D Aircraft Models +\
        \ versioned offline shell */\",1)\ns=s.replace(\"const CACHE='aeronav-jorge-RC12_37_7-aircraft-visuals-20261008';\"\
        ,\n            \"const CACHE='aeronav-jorge-RC12_37_8-aircraft3d-20261008';\",1)\ns=s.replace(\"release:'RC12.37.7'\"\
        ,\"release:'RC12.37.8'\",1)\n\nentries=[\n    '\"./aircraft-3d-models.js\"',\n    '\"./assets/aircraft3d/c152.glb\"\
        ',\n    '\"./assets/aircraft3d/c172.glb\"',\n    '\"./assets/aircraft3d/q400.glb\"',\n    '\"./assets/aircraft3d/b7377.glb\"\
        ',\n    '\"./assets/aircraft3d/a2203.glb\"',\n    '\"./assets/aircraft3d/b777300.glb\"',\n    '\"./assets/aircraft3d/b7879.glb\"\
        ',\n    '\"./assets/aircraft3d/b78710.glb\"'\n]\nif '\"./aircraft-3d-models.js\"' not in s:\n    s=s.replace('const\
        \ LOCAL=[\"./aircraft-visual-profiles.js\",',\n                'const LOCAL=['+\", \".join(entries)+', \"./aircraft-visual-profiles.js\"\
        ,',1)\n\nPath(\"sw.js\").write_text(s,encoding=\"utf-8\")\nPY\n"
    - name: Validate RC12.37.8
      shell: bash
      run: "set -euo pipefail\nnode --check sw.js\nnode --check photo3d-renderer.js\nnode --check aircraft-3d-models.js\n\n\
        grep -q \"<title>AERONAV — RC12.37.8</title>\" index.html\ngrep -q \"const APP_VERSION = 'RC12.37.8 · True 3D Aircraft\
        \ Models';\" index.html\ngrep -q 'photo3d-renderer.js?v=RC12.37.8' index.html\ngrep -q 'aircraft-3d-models.js?v=RC12.37.8'\
        \ index.html\n\ngrep -q \"__AERONAV_3D_AIRCRAFT_CAMERA_OVERRIDE__\" photo3d-renderer.js\ngrep -q \"viewer: () => runtime.viewer\"\
        \ photo3d-renderer.js\ngrep -q \"release: 'RC12.37.8'\" photo3d-renderer.js\n\ngrep -q \"AERONAV3DAircraft\" aircraft-3d-models.js\n\
        grep -q \"Model.fromGltfAsync\" aircraft-3d-models.js\ngrep -q \"HeadingPitchRange\" aircraft-3d-models.js\n\nfor\
        \ f in assets/aircraft3d/c152.glb assets/aircraft3d/c172.glb assets/aircraft3d/q400.glb assets/aircraft3d/b7377.glb\
        \ assets/aircraft3d/a2203.glb assets/aircraft3d/b777300.glb assets/aircraft3d/b7879.glb assets/aircraft3d/b78710.glb\n\
        do\n  test -s \"$f\"\n  test \"$(head -c 4 \"$f\")\" = \"glTF\"\ndone\n\ngrep -q \"aeronav-jorge-RC12_37_8-aircraft3d-20261008\"\
        \ sw.js\ngrep -q \"release:'RC12.37.8'\" sw.js\ngrep -q '\"./aircraft-3d-models.js\"' sw.js\ngrep -q '\"./assets/aircraft3d/b78710.glb\"\
        ' sw.js\n"
    - name: Commit RC12.37.8
      shell: bash
      run: "set -euo pipefail\ngit config user.name \"AERONAV Update\"\ngit config user.email \"actions@users.noreply.github.com\"\
        \ngit add index.html sw.js photo3d-renderer.js aircraft-3d-models.js assets/aircraft3d\nif git diff --cached --quiet;\
        \ then\n  echo \"No changes required.\"\n  exit 0\nfi\ngit commit -m \"RC12.37.8 add procedural 3D aircraft models\"\
        \ngit push origin HEAD:main\n"
