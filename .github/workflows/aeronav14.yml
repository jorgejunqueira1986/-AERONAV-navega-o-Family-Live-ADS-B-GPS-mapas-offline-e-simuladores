      - name: Verificar GLB e integridade
        shell: bash
        run: |
          set -euo pipefail
          node --check aircraft-perspective-viewer.js
          node --check flight-camera-director.js
          node --check aircraft-3d-models.js
          node --check cockpit-lite.js
          node --check sw.js
          grep -Fq 'host.appendChild(menu)' cockpit-lite.js
          grep -Fq 'aircraft-perspective-viewer.js?v=RC12.37.14' index.html
          grep -Fq 'aircraftOnly:true' flight-camera-director.js
          ! grep -Fq 'm.easeTo(' flight-camera-director.js
          ! grep -Fq "label:'FRENTE'" flight-camera-director.js
          grep -Fq 'aeronav-jorge-RC12_37_14-plane-perspective-20261008' sw.js
          python3 - <<'PYCODE'
          from pathlib import Path
          import json,struct
          for name in ('c152','c172','q400','b7377','a2203','b777300','b7879','b78710'):
              data=(Path('assets/aircraft3d')/(name+'.glb')).read_bytes()
              assert data[:4]==b'glTF' and struct.unpack_from('<I',data,4)[0]==2,name
              assert struct.unpack_from('<I',data,8)[0]==len(data),name
              size,typ=struct.unpack_from('<II',data,12)
              assert typ==0x4E4F534A,name
              scene=json.loads(data[20:20+size])
              assert scene['meshes'],name
              for mesh in scene['meshes']:
                for part in mesh['primitives']:
                  v=scene['accessors'][part['attributes']['POSITION']]
                  i=scene['accessors'][part['indices']]
                  assert v['type']=='VEC3' and v['componentType']==5126,name
                  assert i['type']=='SCALAR' and i['componentType']==5123,name
              print('3D GLB verificado:',name)
          PYCODE
          echo 'RC12.37.14: validacao concluida'

      - name: Publicar RC12.37.14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'AERONAV Update'
          git config user.email 'actions@users.noreply.github.com'
          git add aircraft-perspective-viewer.js flight-camera-director.js aircraft-3d-models.js index.html sw.js
          if git diff --cached --quiet; then echo 'Sem alterações por aplicar.'; exit 0; fi
          git commit -m 'RC12.37.14 aircraft camera controls 3D TAAG GLB, not map'
          git push origin HEAD:main
