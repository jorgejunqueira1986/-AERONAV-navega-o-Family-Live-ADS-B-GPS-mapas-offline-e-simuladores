          swfile=Path('sw.js');sw=swfile.read_text(encoding='utf-8')
          m=re.search(r'const LOCAL=(\[[^\n]*\]);',sw)
          assert m,'Lista offline LOCAL nao encontrada'
          local=json.loads(m.group(1))
          extra=['./flight-angle-photo-renderer.js',
                 './assets/flight-angle-renders/b777300/behind_rc123716.webp',
                 './assets/flight-angle-renders/b777300/cockpit_rc123716.webp']
          local=extra+[x for x in local if x not in extra]
          sw=sw[:m.start(1)]+json.dumps(local,ensure_ascii=False,separators=(',',':'))+sw[m.end(1):]
          sw,n=re.subn(r"const CACHE='[^']+';","const CACHE='aeronav-jorge-RC12_37_16-rear-and-live-cockpit-20261008';",sw,count=1)
          assert n==1,'CACHE nao encontrada'
          sw=sw.replace("release:'RC12.37.15'","release:'RC12.37.16'")
          swfile.write_text(sw,encoding='utf-8')
          print('RC12.37.16: index.html e cache offline atualizados; outros avioes e mapas preservados.')
          PY
      - name: Validar JS, imagens transparentes e integracao
        shell: bash
        run: |
          set -euo pipefail
          node --check flight-angle-photo-renderer.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ('behind_rc123716.webp','cockpit_rc123716.webp'):
              f=Path('assets/flight-angle-renders/b777300') / name
              assert f.is_file() and f.read_bytes()[:4]==b'RIFF' and f.read_bytes()[8:12]==b'WEBP'
              print('Imagem valida:',name,f.stat().st_size)
          html=Path('index.html').read_text()
          assert html.count('flight-angle-photo-renderer.js?v=RC12.37.16')==1
          assert 'aircraft-perspective-viewer.js?v=RC12.37.14' in html
          sw=Path('sw.js').read_text()
          assert 'RC12_37_16' in sw
          for name in ('behind_rc123716.webp','cockpit_rc123716.webp'):
              assert './assets/flight-angle-renders/b777300/'+name in sw
          js=Path('flight-angle-photo-renderer.js').read_text()
          assert 'cockpitCenterNavDisplay3716' in js
