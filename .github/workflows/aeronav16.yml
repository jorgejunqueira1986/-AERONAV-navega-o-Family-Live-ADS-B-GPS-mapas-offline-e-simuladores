          from pathlib import Path
          import json,re
          htmlfile=Path('index.html');s=htmlfile.read_text(encoding='utf-8')
          old='./flight-angle-photo-renderer.js?v=RC12.37.15'
          new='./flight-angle-photo-renderer.js?v=RC12.37.16'
          assert s.count(old)+s.count(new)==1, 'Referencia do renderizador de fotos nao encontrada ou duplicada'
          s=s.replace(old,new)
          s,n=re.subn(r'<title>AERONAV — RC[^<]+</title>','<title>AERONAV — RC12.37.16</title>',s,count=1)
