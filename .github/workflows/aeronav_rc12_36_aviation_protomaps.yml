              if index.count(anchor)!=1:
                  raise SystemExit(f"Âncora File import: esperado 1, encontradas {index.count(anchor)}.")
              index=index.replace(anchor,'  // AERONAV_PROTOMAPS_MANAGER_RC1236_BEGIN\n  const AERONAV_BASEMAP_SELECTED_KEY=\'aeronav.offlineBase.selected\';\n\n  function aeronavBaseKindLabel(kind){\n    if(kind===\'basemap\')return \'MAPA BASE\';\n    if(kind===\'aviation\')return \'VOO\';\n    if(kind===\'terrain\')return \'TERRENO\';\n    return \'CONDUÇÃO\';\n  }\n\n  async function aeronavUseProtomapsBase(id){\n    const maps=await dbAll(\'maps\');\n    const rec=maps.find(m=>m.id===id&&m.blob);\n    if(!rec)throw new Error(\'Mapa Protomaps não encontrado neste dispositivo.\');\n    if(rec.pmtilesSchema!==\'protomaps\')throw new Error(\'O ficheiro selecionado não foi identificado como Protomaps.\');\n\n    localStorage.setItem(AERONAV_BASEMAP_SELECTED_KEY,rec.id);\n    state.offlineMapRecord=rec;\n    state.preferOfflineMap=true;\n    state.net=\'offline\';\n    localStorage.setItem(\'aeronav.net\',\'offline\');\n    syncSegments();\n\n    if(state.activeTab!==\'map\')setTab(\'map\');\n    await ensureMapStack(true);\n    await useOfflinePmtiles(rec);\n\n    if(state.mode===\'flight\'){\n      try{await angolaApplyTerrain();}catch(_){}\n      try{await angolaApplyVfrOverlay();}catch(_){}\n    }\n    if(state.currentPosition&&state.followOwnship)setTimeout(()=>forceCenterOnPosition(state.currentPosition),120);\n    toast(\'Protomaps offline ativo como mapa-base.\');\n  }\n\n  async function aeronavClearProtomapsBase(){\n    localStorage.removeItem(AERONAV_BASEMAP_SELECTED_KEY);\n    state.preferOfflineMap=false;\n    state.offlineMapRecord=null;\n    toast(\'Mapa-base automático restaurado.\');\n    if(state.activeTab===\'map\')await updateMapMode();\n    if(state.activeTab===\'offline\')renderOfflineScreen();\n  }\n\n  async function aeronavInjectProtomapsCard(){\n    const cards=document.querySelector(\'#screen-offline .cards\');\n    if(!cards)return;\n    document.getElementById(\'aeronavProtomapsCard\')?.remove();\n\n    const maps=(await dbAll(\'maps\')).filter(m=>m?.blob&&m.pmtilesSchema===\'protomaps\');\n    const selected=localStorage.getItem(AERONAV_BASEMAP_SELECTED_KEY)||\'\';\n    const card=document.createElement(\'div\');\n    card.className=\'card\';\n    card.id=\'aeronavProtomapsCard\';\n\n    const rows=maps.length?maps.map(m=>`\n      <div class="list-item">\n        <div class="item-icon">🌍</div>\n        <div class="item-main">\n          <strong>${esc(m.name)}</strong>\n          <small>${(m.size/1024/1024/1024)>=1?(m.size/1024/1024/1024).toFixed(1)+\' GB\':(m.size/1024/1024).toFixed(1)+\' MB\'} · Protomaps · Z${m.minZoom??\'—\'}–${m.maxZoom??\'—\'}</small>\n        </div>\n        <span class="badge ${selected===m.id?\'ok\':\'info\'}">${selected===m.id?\'ATIVO\':\'PRONTO\'}</span>\n        <button class="icon-btn" data-use-protomaps="${m.id}">Usar</button>\n      </div>`).join(\'\'):\'<div class="empty">Nenhum mapa Protomaps importado.</div>\';\n\n    card.innerHTML=`\n      <div class="page-head">\n        <div>\n          <h3>🌍 Base Protomaps + PMTiles</h3>\n          <p>Mapa vetorial de alta qualidade para VOO, CARRO e A PÉ.</p>\n        </div>\n        <span class="badge ${maps.length?\'ok\':\'info\'}">${maps.length} MAPA${maps.length===1?\'\':\'S\'}</span>\n      </div>\n      <div class="sub">O Protomaps funciona como mapa-base. No modo VOO, o AERONAV coloca por cima VFR, navegação, rota, ADS-B e relevo quando disponíveis.</div>\n      <div class="btn-row" style="margin-top:12px">\n        <button class="primary-btn" id="importProtomapsBase">Importar Protomaps PMTiles</button>\n        ${selected?\'<button class="secondary-btn" id="clearProtomapsBase">Usar seleção automática</button>\':\'\'}\n      </div>\n      <div class="list" style="margin-top:12px">${rows}</div>\n      <div class="notice good" style="margin-top:10px">Recomendado: dividir o mundo por continente/região. O ficheiro permanece vetorial e mantém texto/linhas nítidos em qualquer resolução.</div>`;\n\n    cards.insertBefore(card,cards.firstChild);\n\n    card.querySelector(\'#importProtomapsBase\')?.addEventListener(\'click\',()=>{\n      state.pendingMapKind=\'basemap\';\n      $(\'#pmtilesFileInput\')?.click();\n    });\n    card.querySelector(\'#clearProtomapsBase\')?.addEventListener(\'click\',()=>aeronavClearProtomapsBase().catch(e=>toast(e.message||String(e))));\n    card.querySelectorAll(\'[data-use-protomaps]\').forEach(b=>b.addEventListener(\'click\',()=>{\n      aeronavUseProtomapsBase(b.dataset.useProtomaps).catch(e=>toast(e.message||String(e)));\n    }));\n  }\n\n  const aeronavRenderOfflineBeforeProtomaps=renderOfflineScreen;\n  renderOfflineScreen=async function(...args){\n    const out=await aeronavRenderOfflineBeforeProtomaps.apply(this,args);\n    setTimeout(()=>aeronavInjectProtomapsCard().catch(e=>console.warn(\'AERONAV Protomaps UI\',e)),0);\n    return out;\n  };\n  // AERONAV_PROTOMAPS_MANAGER_RC1236_END'+ "\n\n"+anchor,1)

