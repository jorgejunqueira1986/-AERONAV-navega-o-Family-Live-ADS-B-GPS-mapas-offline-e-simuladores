name: AERONAV RC12.10 Meteo Visual VOO
on:
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/aeronav_rc12_10_meteo_visual_voo.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout current AERONAV
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install RC12.10 modules
      shell: bash
      run: 'echo '''' | base64 -d > flight-ops-fragment.js

        echo '''' | base64 -d > gps-view-modes.js

        echo '''' | base64 -d > meteo-visual-voo.js

        echo '''' | base64 -d > /tmp/aeronav_rc1210_patch.py

        python3 /tmp/aeronav_rc1210_patch.py'
    - name: Validate RC12.10
      shell: bash
      run: 'node --check flight-ops-fragment.js

        node --check gps-view-modes.js

        node --check meteo-visual-voo.js

        node --check sw.js

        node --check mathia/sw.js

        node --check wendler/sw.js

        grep -q ''meteo-visual-voo.js'' sw.js

        grep -q ''gps-view-modes.js'' sw.js

        grep -q ''flight-ops-fragment.js'' sw.js

        grep -q ''flight-ops-fragment.js'' mathia/sw.js

        grep -q ''flight-ops-fragment.js'' wendler/sw.js

        grep -q ''WIND'' meteo-visual-voo.js

        grep -q ''RAIN'' meteo-visual-voo.js

        grep -q ''CLOUD'' meteo-visual-voo.js'
    - name: Commit RC12.10
      shell: bash
      run: 'git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add flight-ops-fragment.js gps-view-modes.js meteo-visual-voo.js sw.js mathia/sw.js wendler/sw.js

        if git diff --cached --quiet; then echo "RC12.10 already applied"; exit 0; fi

        git commit -m "AERONAV RC12.10 visual weather flight mode"

        git push'
