name: AERONAV RC11.98 Work Commute + Folga Avatars

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/aeronav_rc11_98_work_folga.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current AERONAV
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply RC11.98
        shell: bash
        run: |
          cat > work-status-fragment.js <<'JS'
          /* AERONAV RC11.98 — Work/Home commute avatars + Jorge Folga state.
             New photo assets expected later:
             - assets/vehicles/work-car-avatar.png
             - assets/people/jorge-folga-avatar.png
             Missing assets are ignored so the current avatars remain unchanged. */
          (()=>{
            'use strict';
            if(window.__AERONAV_WORK_STATUS_RC1198)return;
            window.__AERONAV_WORK_STATUS_RC1198=true;
          
            const path=(location.pathname||'').toLowerCase();
            const role=path.includes('/mathia/')?'mathia':path.includes('/wendler/')?'wendler':'jorge';
            const root=role==='jorge'?'./':'../';
            const assets={
              car:new URL(root+'assets/vehicles/work-car-avatar.png',location.href).href,
              jorgeFolga:new URL(root+'assets/people/jorge-folga-avatar.png',location.href).href
            };
            const available={car:false,jorgeFolga:false};
            const remoteMode=new Map();
            let applying=false;
            let lastRoad=false;
          
            function checkAsset(url,key){
              const img=new Image();
              img.onload=()=>{available[key]=true;applyAvatars();};
              img.onerror=()=>{available[key]=false;};
              img.src=url+(url.includes('?')?'&':'?')+'v=RC11.98';
            }
            checkAsset(assets.car,'car');
            checkAsset(assets.jorgeFolga,'jorgeFolga');
          
            function getRoute(){
              try{
                if(typeof state!=='undefined'&&state)return state.currentRoute||state.activeRoute||null;
              }catch(_){}
              try{
                if(typeof cfg!=='undefined'&&cfg)return cfg.ownRoute||cfg.currentRoute||cfg.activeRoute||null;
              }catch(_){}
              return null;
            }
            function roadRouteActive(){
              const r=getRoute();if(!r)return false;
              const kind=String(r.kind||r.mode||r.transport||r.travelMode||'').toLowerCase();
              if(kind)return /road|car|drive|driving|carro|condu/.test(kind)&&!/flight|voo|walk|foot|ped/.test(kind);
              const txt=JSON.stringify(r).toLowerCase();
              return /carro|condu|drive|driving|road/.test(txt)&&!/flight|voo/.test(txt);
            }
            function commuteRouteActive(){
              const r=getRoute();if(!r||!roadRouteActive())return false;
              const txt=JSON.stringify(r).toLowerCase();
              return /trabalho|work|emprego|office|escrit[oó]rio|casa|home|resid[eê]ncia/.test(txt);
            }
            function isFolga(){return role==='jorge'&&localStorage.getItem('aeronav.jorge.folga')==='1';}
            function localMode(){
              if(isFolga())return 'folga';
              if(commuteRouteActive())return 'car';
              return 'person';
            }
          
            function injectFolgaButton(){
              if(role!=='jorge'||document.getElementById('aeronavFolgaBtn'))return;
              const b=document.createElement('button');
              b.id='aeronavFolgaBtn';b.type='button';
              b.style.cssText='position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:2147483000;border:1px solid rgba(255,255,255,.24);border-radius:999px;padding:10px 16px;font:700 14px system-ui,-apple-system,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;color:#fff';
              const paint=()=>{const on=isFolga();b.textContent=on?'Folga ✓':'Folga';b.setAttribute('aria-pressed',on?'true':'false');b.style.background=on?'rgba(210,42,86,.94)':'rgba(20,25,31,.90)';};
              b.addEventListener('click',()=>{
                const on=!isFolga();localStorage.setItem('aeronav.jorge.folga',on?'1':'0');paint();applyAvatars();
                try{window.dispatchEvent(new CustomEvent('aeronav:work-status',{detail:{role:'jorge',mode:on?'folga':'person'}}));}catch(_){}
              });
              paint();document.body.appendChild(b);
            }
          
            function elementText(el){
              let out='';let n=el;
              for(let i=0;n&&i<4;i++,n=n.parentElement){
                out+=' '+(n.id||'')+' '+(typeof n.className==='string'?n.className:'')+' '+(n.getAttribute?.('aria-label')||'')+' '+(n.getAttribute?.('title')||'');
                if(i<2)out+=' '+String(n.textContent||'').slice(0,120);
              }
              return out.toLowerCase();
            }
            function sourceOf(el){
              if(el.tagName==='IMG')return el.currentSrc||el.src||'';
              const bg=el.style?.backgroundImage||getComputedStyle(el).backgroundImage||'';
              const m=bg.match(/url\(["']?(.*?)["']?\)/i);return m?m[1]:'';
            }
            function identity(el,src){
              const hay=(src+' '+elementText(el)).toLowerCase();
              if(/jorge/.test(hay))return 'jorge';
              if(/mathia/.test(hay))return 'mathia';
              if(/wendler|wendy/.test(hay))return 'wendler';
              return '';
            }
            function desiredMode(id,src){
              if(id===role)return localMode();
              const rm=remoteMode.get(id);if(rm)return rm;
              return 'person';
            }
            function setImg(el,url){
              if(!el.dataset.aeronavOriginalSrc)el.dataset.aeronavOriginalSrc=el.currentSrc||el.src||'';
              if(el.src!==url)el.src=url;
            }
            function restoreImg(el){
              const orig=el.dataset.aeronavOriginalSrc;
              if(orig&&el.src!==orig)el.src=orig;
              delete el.dataset.aeronavOriginalSrc;
            }
            function setBg(el,url){
              if(!el.dataset.aeronavOriginalBg)el.dataset.aeronavOriginalBg=el.style.backgroundImage||getComputedStyle(el).backgroundImage||'';
              el.style.backgroundImage='url("'+url+'")';
              el.style.backgroundSize='contain';el.style.backgroundRepeat='no-repeat';el.style.backgroundPosition='center';
            }
            function restoreBg(el){
              if(el.dataset.aeronavOriginalBg!==undefined&&el.dataset.aeronavOriginalBg!=='')el.style.backgroundImage=el.dataset.aeronavOriginalBg;
              delete el.dataset.aeronavOriginalBg;
            }
            function applyOne(el){
              const src=sourceOf(el);if(!src)return;
              const id=identity(el,src);const isCar=/work-car-avatar|toyota-yaris|vehicle|car-avatar/i.test(src);
              if(!id&&!isCar)return;
              const mode=id?desiredMode(id,src):(isCar&&localMode()==='car'?'car':'person');
              if(mode==='folga'&&id==='jorge'&&available.jorgeFolga){el.tagName==='IMG'?setImg(el,assets.jorgeFolga):setBg(el,assets.jorgeFolga);return;}
              if(mode==='car'&&available.car&&(id==='jorge'||id==='mathia'||isCar)){el.tagName==='IMG'?setImg(el,assets.car):setBg(el,assets.car);return;}
              el.tagName==='IMG'?restoreImg(el):restoreBg(el);
            }
            function applyAvatars(){
              if(applying)return;applying=true;
              try{
                document.querySelectorAll('img').forEach(applyOne);
                document.querySelectorAll('[style*="background"],.maplibregl-marker,.marker,.avatar').forEach(applyOne);
              }catch(_){}finally{applying=false;}
            }
          
            function readLocations(data){
              if(!Array.isArray(data))return;
              for(const m of data){
                const n=String(m?.display_name||m?.name||'').trim().toLowerCase();
                const id=n.includes('jorge')?'jorge':n.includes('mathia')?'mathia':n.includes('wendler')||n.includes('wendy')?'wendler':'';
                if(!id)continue;
                const tr=String(m?.transport||'').toLowerCase();
                remoteMode.set(id,tr==='folga'?'folga':tr==='work-car'?'car':'person');
              }
              applyAvatars();
            }
          
            const nativeFetch=window.fetch.bind(window);
            window.fetch=async function(input,init){
              let nextInit=init;
              try{
                const url=typeof input==='string'?input:(input?.url||'');
                const locations=/aeronav_locations/i.test(url);
                if(locations&&init?.body&&typeof init.body==='string'&&/POST|PATCH|PUT/i.test(String(init.method||'POST'))){
                  let body=JSON.parse(init.body),changed=false;const rows=Array.isArray(body)?body:[body];
                  for(const row of rows){
                    const n=String(row?.display_name||'').toLowerCase();
                    const mine=(role==='jorge'&&n.includes('jorge'))||(role==='mathia'&&n.includes('mathia'));
                    if(!mine)continue;
                    const mode=localMode();
                    if(mode==='folga'){row.transport='folga';changed=true;}
                    else if(mode==='car'){row.transport='work-car';changed=true;}
                  }
                  if(changed)nextInit={...init,body:JSON.stringify(Array.isArray(body)?rows:rows[0])};
                }
                const res=await nativeFetch(input,nextInit);
                if(locations&&res?.ok)res.clone().json().then(readLocations).catch(()=>{});
                return res;
              }catch(_){return nativeFetch(input,init);}
            };
          
            const observer=new MutationObserver(applyAvatars);
            function tick(){
              const nowRoad=commuteRouteActive();
              if(nowRoad!==lastRoad){lastRoad=nowRoad;applyAvatars();}
              injectFolgaButton();applyAvatars();
            }
            function start(){
              lastRoad=commuteRouteActive();injectFolgaButton();applyAvatars();
              try{observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src','style','class']});}catch(_){}
              setInterval(tick,1500);
              document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
              window.addEventListener('pageshow',tick);
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Main app: preserve RC11.97 Angola Offline logic and inject RC11.98 module at navigation HTML.
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if 'RC11_98-work-folga' not in s:
              s=s.replace('/* AERONAV — RC11.97 Angola Offline verified import + RC11.94 preserved',
                          '/* AERONAV — RC11.98 Work/Home avatars + Folga; RC11.97 Angola Offline preserved',1)
              s=s.replace("const CACHE='aeronav-jorge-RC11_97-angola-verified-import-20260930-1';",
                          "const CACHE='aeronav-jorge-RC11_98-work-folga-20260930-1';",1)
              old="'./angola-offline-fragment.js','./vendor/pmtiles-3.2.1.js'"
              new="'./angola-offline-fragment.js','./vendor/pmtiles-3.2.1.js','./work-status-fragment.js'"
              if old not in s: raise SystemExit('root LOCAL pattern missing')
              s=s.replace(old,new,1)
              old="    const body=html.replace(marker,fragment+'\\n'+marker);"
              new="    let body=html.replace(marker,fragment+'\\n'+marker);"+chr(10)+"    if(!body.includes('work-status-fragment.js'))body=body.replace(/<\\/body>/i,'<script src=\"./work-status-fragment.js?v=RC11.98\"></script></body>');"
              if old not in s: raise SystemExit('root injection pattern missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          def patch_child(path,kind,label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if 'RC11_98-work-folga' in s: return
              s=re.sub(r'^/\* AERONAV[^\n]*\*/',f'/* AERONAV RC11.98 — {label} Work/Home avatar + Jorge Folga viewer */',s,count=1)
              s=re.sub(r"const CACHE='[^']+';",f"const CACHE='aeronav-{kind}-RC11_98-work-folga-20260930-1';",s,count=1)
              m=re.search(r'const CORE=\[([^\]]*)\];',s)
              if not m: raise SystemExit(f'{kind} CORE missing')
              inner=m.group(1)
              if 'work-status-fragment.js' not in inner:
                  s=s[:m.start()]+f"const CORE=[{inner},'../work-status-fragment.js'];"+s[m.end():]
              helper="async function injectWorkStatus(response){if(!response||!response.ok)return response;try{const html=await response.text();if(html.includes('work-status-fragment.js'))return new Response(html,{status:response.status,statusText:response.statusText,headers:response.headers});const body=html.replace(/<\\/body>/i,'<script src=\"../work-status-fragment.js?v=RC11.98\"></script></body>');const h=new Headers(response.headers);h.delete('content-length');h.delete('content-encoding');h.set('content-type','text/html; charset=utf-8');return new Response(body,{status:response.status,statusText:response.statusText,headers:h});}catch(_){return response;}}"+chr(10)
              if 'async function injectWorkStatus' not in s:
                  if 'async function warm()' not in s: raise SystemExit(f'{kind} warm missing')
                  s=s.replace('async function warm()',helper+'async function warm()',1)
              old="if(r.mode==='navigate'){e.respondWith(fetch(r).then(async res=>{const c=await caches.open(CACHE);if(res.ok)await c.put('./index.html',res.clone());return res;}).catch(()=>caches.match('./index.html')));return;}"
              new="if(r.mode==='navigate'){e.respondWith(fetch(r).then(async res=>{const c=await caches.open(CACHE);if(res.ok)await c.put('./index.html',res.clone());return injectWorkStatus(res);}).catch(async()=>injectWorkStatus(await caches.match('./index.html'))));return;}"
              if old not in s: raise SystemExit(f'{kind} navigation pattern missing')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          patch_child('mathia/sw.js','mathia','Mathia')
          patch_child('wendler/sw.js','wendler','Wendler')

          Path('READ_FIRST_RC11_98_WORK_FOLGA.txt').write_text('''AERONAV RC11.98 — WORK/HOME + FOLGA\n\n- Jorge e Mathia: rota terrestre Casa↔Trabalho ativa usa o avatar de carro da foto a fornecer.\n- Ao terminar/cancelar a rota e chegar ao destino, regressa imediatamente ao avatar atual de pessoa.\n- Funciona nos dois sentidos: casa → trabalho e trabalho → casa.\n- Jorge: novo botão Folga.\n- Folga tem prioridade visual e usa o avatar assets/people/jorge-folga-avatar.png quando existir.\n- O estado é propagado pelo campo transport do Family Live: work-car / folga (sem alterar os restantes modos).\n- Mathia e Wendler conseguem refletir o estado recebido do Family Live.\n- Até as fotos serem adicionadas, há fallback seguro para os avatares atuais.\n\nASSETS A ENVIAR DEPOIS:\n1. assets/vehicles/work-car-avatar.png\n2. assets/people/jorge-folga-avatar.png\n\nRC11.97 Angola Offline/PMTiles é preservado.\n''',encoding='utf-8')
          PY

      - name: Validate RC11.98
        shell: bash
        run: |
          node --check work-status-fragment.js
          node --check sw.js
          node --check mathia/sw.js
          node --check wendler/sw.js
          grep -q 'RC11_98-work-folga' sw.js
          grep -q 'RC11_98-work-folga' mathia/sw.js
          grep -q 'RC11_98-work-folga' wendler/sw.js
          grep -q 'aeronavFolgaBtn' work-status-fragment.js
          grep -q "row.transport='folga'" work-status-fragment.js
          grep -q "row.transport='work-car'" work-status-fragment.js
          grep -q 'commuteRouteActive' work-status-fragment.js
          echo 'RC11.98 validation OK'

      - name: Commit RC11.98
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work-status-fragment.js sw.js mathia/sw.js wendler/sw.js READ_FIRST_RC11_98_WORK_FOLGA.txt
          if git diff --cached --quiet; then
            echo "RC11.98 already applied"
            exit 0
          fi
          git commit -m "AERONAV RC11.98 work commute avatars and Folga state"
          git push
