name: AERONAV RC11.99 Flight Ops
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/aeronav_rc11_99_flight_ops.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout current AERONAV
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install RC11.99
      shell: bash
      run: 'echo '''' | base64 -d > flight-ops-fragment.js

        echo '''' | base64 -d > /tmp/aeronav_patch.py

        python3 /tmp/aeronav_patch.py'
    - name: Validate RC11.99
      shell: bash
      run: 'node --check flight-ops-fragment.js

        node --check sw.js

        node --check mathia/sw.js

        node --check wendler/sw.js

        grep -q ''flight-ops-fragment.js'' sw.js

        grep -q ''flight-ops-fragment.js'' mathia/sw.js

        grep -q ''flight-ops-fragment.js'' wendler/sw.js'
    - name: Commit RC11.99
      shell: bash
      run: 'git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add flight-ops-fragment.js sw.js mathia/sw.js wendler/sw.js

        if git diff --cached --quiet; then echo ''Already applied''; exit 0; fi

        git commit -m ''AERONAV RC11.99 flight ops''

        git push'
